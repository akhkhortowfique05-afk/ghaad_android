plugins { id 'com.android.application' }
android {
    namespace 'com.ghaad.shield'
    compileSdk 34
    defaultConfig {
        applicationId "com.ghaad.shield"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.mlkit:face-detection:16.1.6'
}
