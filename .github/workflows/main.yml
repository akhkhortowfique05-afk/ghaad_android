                      int x1 = Math.max(0, faceBox.left - padX);
                      int y1 = Math.max(0, faceBox.top - padY);
                      int x2 = Math.min(w, faceBox.right + padX);
                      int y2 = Math.min(h, faceBox.bottom + padY);
                      if (x2 - x1 < 12 || y2 - y1 < 12) return false;

                      Bitmap crop = Bitmap.createBitmap(bmp, x1, y1, x2 - x1, y2 - y1);
                      Bitmap resized = Bitmap.createScaledBitmap(crop, 128, 128, true);
                      crop.recycle();

                      int[] pixels = new int[128 * 128];
                      resized.getPixels(pixels, 0, 128, 0, 0, 128, 128);
                      resized.recycle();

                      FloatBuffer fb = FloatBuffer.allocate(3 * 128 * 128);
                      int area = 128 * 128;
                      for (int i = 0; i < area; i++) {
                          int px = pixels[i];
                          fb.put(i, ((px >> 16) & 0xFF) / 255.0f);
                          fb.put(area + i, ((px >> 8) & 0xFF) / 255.0f);
                          fb.put(2 * area + i, (px & 0xFF) / 255.0f);
                      }
                      fb.rewind();

                      OnnxTensor tensor = OnnxTensor.createTensor(env, fb, new long[]{1, 3, 128, 128});
                      OrtSession.Result res = genderSession.run(Collections.singletonMap(genderInputName, tensor));
                      float[][] probs = (float[][]) res.get(0).getValue();
                      tensor.close();
                      res.close();

                      float femaleProb = probs[0][0];
                      float maleProb = probs[0][1];
                      return femaleProb >= 0.58f && femaleProb > maleProb;
                  } catch (Exception e) {
                      return false;
                  }
