                  if (upperCount > 0 && lowerCount > 0) {
                      long avgUpper = upperBrightness / upperCount;
                      long avgLower = lowerBrightness / lowerCount;
                      // Men with beard/mustache/stubble (like 00:02 & 00:16) have significantly darker lower jaw than forehead!
                      if ((avgUpper - avgLower) >= 22 || (darkBeardPixels * 100 / lowerCount) >= 28) {
                          return true; // Confirmed Bearded/Mustached Man!
                      }
                  }

                  // Cue C: Check if person has short hair (ears/neck sides show background wall, NOT long hair/hijab wrapping down to shoulders)
                  int neckY1 = t + (int) (fh * 0.70f);
                  int neckY2 = Math.min(h - 1, b + fh / 3);
                  int leftNeckX = Math.max(0, l - fw / 5);
                  int rightNeckX = Math.min(w - 1, r + fw / 5);

                  int darkHairWrap = 0, neckSamples = 0;
                  for (int y = neckY1; y <= neckY2; y += 2) {
                      neckSamples++;
                      int pxL = bmp.getPixel(leftNeckX, y);
                      int pxR = bmp.getPixel(rightNeckX, y);
                      // Women (like 00:00 Othoba girl or 00:10 Hijab girl) have dark hair or hijab tightly framing both sides of the lower jaw/neck
                      if (getLuminance(pxL) < 65 && getLuminance(pxR) < 65) {
                          darkHairWrap++;
                      }
