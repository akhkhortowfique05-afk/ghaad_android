                  int G = (px >> 8) & 0xFF;
                  int B = px & 0xFF;
                  if (R > 65 && G > 28 && B > 15 && R > G && G >= B && (R - G) >= 10 && (R - B) <= 135) {
                      int Cr = 128 + ((112 * R - 93 * G - 18 * B) >> 8);
                      int Cb = 128 + ((-37 * R - 74 * G + 112 * B) >> 8);
                      return Cr >= 131 && Cr <= 176 && Cb >= 78 && Cb <= 128;
                  }
                  return false;
              }

              private List<Rect> mergeBoxesCleanly(List<Rect> boxes, int screenW, int screenH) {
                  if (boxes.size() <= 1) return boxes;
                  List<Rect> merged = new ArrayList<>(boxes);
                  boolean changed = true;
                  while (changed) {
                      changed = false;
                      for (int i = 0; i < merged.size(); i++) {
                          for (int j = i + 1; j < merged.size(); j++) {
                              Rect a = merged.get(i);
                              Rect b = merged.get(j);
                              Rect exp = new Rect(a.left - 60, a.top - 60, a.right + 60, a.bottom + 60);
                              if (Rect.intersects(exp, b)) {
                                  Rect u = new Rect(a);
                                  u.union(b);
                                  if (u.height() < (int) (screenH * 0.82f)) {
                                      merged.set(i, u);
                                      merged.remove(j);
                                      changed = true;
                                      break;
                                  }
                              }
                          }
                          if (changed) break;
                      }
                  }
                  return merged;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  if (event.getPackageName() != null) {
                      String pkg = event.getPackageName().toString();
                      if (!pkg.contains("systemui")) {
                          activePkg = pkg;
                      }
                      if (isHomeOrSafeApp()) {
                          currentBoxes.clear();
                          overlayView.updateState(Collections.emptyList(), "");
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              @Override
              public void onInterrupt() {}
          }
