                                      int mLeft = Math.max(0, (int) ((fb.left - fw * 1.6f) * scaleX));
                                      int mTop = Math.max(0, (int) ((fb.top - fh * 0.5f) * scaleY));
                                      int mRight = Math.min(screenW, (int) ((fb.right + fw * 1.6f) * scaleX));
                                      int mBottom = Math.min(screenH, (int) ((fb.bottom + fh * 3.5f) * scaleY));
                                      confirmedMaleSafeZones.add(new Rect(mLeft, mTop, mRight, mBottom));
                                  } else {
                                      // It is a Woman (00:00 Othoba ad, 00:10 Nasheed girl, 00:18 actress) OR a Kissing Couple (00:22, 00:34)!
                                      int left = Math.max(0, (int) ((fb.left - fw * 0.95f) * scaleX));
                                      int top = Math.max(0, (int) ((fb.top - fh * 0.50f) * scaleY));
                                      int right = Math.min(screenW, (int) ((fb.right + fw * 0.95f) * scaleX));
                                      int bottom = Math.min(screenH, (int) ((fb.bottom + fh * 2.80f) * scaleY));

                                      if (bottom - top > (int) (screenH * 0.58f)) {
                                          bottom = top + (int) (screenH * 0.58f);
                                      }
                                      newlyDetected.add(new Rect(left, top, right, bottom));
                                  }
                              }

                              // Add V10 Skin Clusters (Belly/Cleavage/Kissing at 00:18-00:42), EXCEPT inside confirmed Male Safe Zones!
                              for (Rect sc : skinClusterBoxes) {
                                  boolean insideMaleZone = false;
                                  for (Rect mz : confirmedMaleSafeZones) {
                                      if (Rect.intersects(sc, mz)) {
                                          insideMaleZone = true;
                                          break;
                                      }
                                  }
                                  if (!insideMaleZone) {
                                      newlyDetected.add(sc);
                                  }
                              }

                              final List<Rect> merged = mergeBoxesCleanly(newlyDetected, screenH);
                              final long now = System.currentTimeMillis();

                              mainHandler.post(() -> {
                                  if (!merged.isEmpty()) {
                                      lastValidBoxes = merged;
                                      lastDetectionTime = now;
                                  } else if (now - lastDetectionTime > 750) {
                                      lastValidBoxes.clear();
                                  }

                                  if (!isHomeOrSafeApp()) {
                                      overlayView.setBoxes(lastValidBoxes, true);
                                  } else {
                                      overlayView.setBoxes(Collections.emptyList(), false);
                                  }
                                  isBusy = false;
                              });
                              bmp.recycle();
                          })
                          .addOnFailureListener(e -> {
                              bmp.recycle();
                              isBusy = false;
                          });
              }

              private boolean areFacesKissingOrTouching(List<Face> faces) {
                  if (faces.size() < 2) return false;
                  for (int i = 0; i < faces.size(); i++) {
                      for (int j = i + 1; j < faces.size(); j++) {
                          Rect a = faces.get(i).getBoundingBox();
                          Rect b = faces.get(j).getBoundingBox();
                          Rect exp = new Rect(a.left - a.width(), a.top - a.height() / 2, a.right + a.width(), a.bottom + a.height());
                          if (Rect.intersects(exp, b)) return true;
                      }
                  }
                  return false;
              }

