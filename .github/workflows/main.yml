                                      int top = Math.max(0, (int) ((fb.top - fh * 0.45f) * scaleY));
                                      int right = Math.min(screenW, (int) ((fb.right + fw * 0.85f) * scaleX));
                                      int bottom = Math.min(screenH, (int) ((fb.bottom + fh * 2.60f) * scaleY));
                                      if (bottom - top > (int) (screenH * 0.58f)) {
                                          bottom = top + (int) (screenH * 0.58f);
                                      }
