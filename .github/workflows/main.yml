name: Build Clean Ghaad Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Play-Protect Safe Android Project
        run: |
          mkdir -p android_build/app/src/main/java/com/ghaad/shield

          cat << 'EOF' > android_build/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GhaadShield"
          include ':app'
          EOF

          cat << 'EOF' > android_build/build.gradle
          plugins {
              id 'com.android.application' version '8.1.2' apply false
          }
          EOF

          cat << 'EOF' > android_build/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > android_build/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ghaad.shield'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ghaad.shield"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="Project Ghaad Shield"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/MainActivity.java
          package com.ghaad.shield;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String SAFE_DNS = "adult-filter-dns.cleanbrowsing.org";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setBackgroundColor(Color.parseColor("#0b0f19"));
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(60, 60, 60, 60);

                  TextView title = new TextView(this);
                  title.setText("PROJECT GHAAD\nMobile Protection Shield");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(24);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 30);
                  layout.addView(title);

                  TextView info = new TextView(this);
                  info.setText("Step 1: Tap the button below to copy the Ghaad Filter DNS.\n\nStep 2: In Settings -> More Connection Settings -> Private DNS, select 'Private DNS provider hostname' and paste it.");
                  info.setTextColor(Color.parseColor("#94a3b8"));
                  info.setTextSize(15);
                  info.setGravity(Gravity.CENTER);
                  info.setPadding(0, 0, 0, 50);
                  layout.addView(info);

                  Button btnActivate = new Button(this);
                  btnActivate.setText("Copy Shield DNS & Open Settings");
                  btnActivate.setOnClickListener(v -> {
                      ClipboardManager clipboard = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      ClipData clip = ClipData.newPlainText("GhaadDNS", SAFE_DNS);
                      clipboard.setPrimaryClip(clip);
                      Toast.makeText(this, "Copied: " + SAFE_DNS, Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_WIRELESS_SETTINGS));
                  });
                  layout.addView(btnActivate);

                  setContentView(layout);
              }
          }
          EOF

      - name: Build APK with Gradle
        working-directory: android_build
        run: gradle assembleDebug

      - name: Prepare APK File
        run: cp android_build/app/build/outputs/apk/debug/app-debug.apk Ghaad_Mobile.apk

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghaad_Mobile_APK
          path: Ghaad_Mobile.apk
