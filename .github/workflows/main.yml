                                      for (int dc = -1; dc <= 1; dc++) {
                                          int nr = cur[0] + dr, nc = cur[1] + dc;
                                          if (nr >= 1 && nr < rows - 1 && nc >= 1 && nc < cols - 1
                                                  && skinGrid[nr][nc] && !visited[nr][nc]) {
                                              visited[nr][nc] = true;
                                              q.add(new int[]{nr, nc});
                                          }
                                      }
                                  }
                              }
                              // 3+ connected cells catches exposed midriff/cleavage (00:18, 00:32) and close-up kissing faces (00:22, 00:40)!
