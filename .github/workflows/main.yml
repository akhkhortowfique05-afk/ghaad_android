name: Build Ghaad V10 Final Male-Fix APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Restored V10 Project (Male Face Fixed)
        run: |
          mkdir -p android_build/app/src/main/java/com/ghaad/shield
          mkdir -p android_build/app/src/main/res/xml

          cat << 'EOF' > android_build/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GhaadShieldV10"
          include ':app'
          EOF

          cat << 'EOF' > android_build/build.gradle
          plugins {
              id 'com.android.application' version '8.1.2' apply false
          }
          EOF

          cat << 'EOF' > android_build/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > android_build/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ghaad.shield'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ghaad.shield"
                  minSdk 24
                  targetSdk 33
                  versionCode 25
                  versionName "10.5"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.mlkit:face-detection:16.1.6'
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>

              <application
                  android:label="Ghaad V10 Shield"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="face"/>

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service android:name=".GhaadGuardService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>

                  <receiver android:name=".GhaadAdminReceiver"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data android:name="android.app.device_admin"
                          android:resource="@xml/device_admin"/>
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_build/app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:accessibilityFlags="flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:notificationTimeout="40"/>
          EOF

          cat << 'EOF' > android_build/app/src/main/res/xml/device_admin.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock/>
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/GhaadAdminReceiver.java
          package com.ghaad.shield;
          import android.app.admin.DeviceAdminReceiver;
          public class GhaadAdminReceiver extends DeviceAdminReceiver {}
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/CensorOverlayView.java
          package com.ghaad.shield;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.view.View;
          import java.util.ArrayList;
          import java.util.List;

          public class CensorOverlayView extends View {
              private final List<Rect> blockedRects = new ArrayList<>();
              private final Paint boxPaint = new Paint();
              private final Paint borderPaint = new Paint();
              private final Paint textPaint = new Paint();
              private final Paint badgePaint = new Paint();
              private boolean showBadge = true;

              public CensorOverlayView(Context context) {
                  super(context);
                  boxPaint.setColor(Color.BLACK);
                  boxPaint.setAlpha(255);
                  boxPaint.setStyle(Paint.Style.FILL);

                  borderPaint.setColor(Color.rgb(220, 38, 38));
                  borderPaint.setStyle(Paint.Style.STROKE);
                  borderPaint.setStrokeWidth(4f);

                  textPaint.setColor(Color.WHITE);
                  textPaint.setTextSize(34f);
                  textPaint.setTextAlign(Paint.Align.CENTER);
                  textPaint.setFakeBoldText(true);

                  badgePaint.setColor(Color.rgb(16, 185, 129));
                  badgePaint.setTextSize(22f);
                  badgePaint.setFakeBoldText(true);
              }

              public synchronized void setBoxes(List<Rect> rects, boolean badge) {
                  blockedRects.clear();
                  if (rects != null) {
                      blockedRects.addAll(rects);
                  }
                  showBadge = badge;
                  postInvalidate();
              }

              @Override
              protected synchronized void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  for (Rect r : blockedRects) {
                      canvas.drawRect(r, boxPaint);
                      canvas.drawRect(r, borderPaint);
                      canvas.drawText("GHAAD V10 BLOCKED", r.centerX(), r.centerY(), textPaint);
                  }
                  if (showBadge) {
                      canvas.drawText("● V10 ACTIVE", 30, 110, badgePaint);
                  }
              }
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/GhaadGuardService.java
          package com.ghaad.shield;

          import android.accessibilityservice.AccessibilityService;
          import android.graphics.Bitmap;
          import android.graphics.ColorSpace;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.hardware.HardwareBuffer;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.face.Face;
          import com.google.mlkit.vision.face.FaceDetection;
          import com.google.mlkit.vision.face.FaceDetector;
          import com.google.mlkit.vision.face.FaceDetectorOptions;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Iterator;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class GhaadGuardService extends AccessibilityService {
              public static GhaadGuardService instance;
              public static volatile String activePkg = "";
              public static volatile long pauseLockUntil = 0;
              public static volatile boolean blockFemaleFaces = true;

              private WindowManager windowManager;
              private CensorOverlayView overlayView;
              private FaceDetector faceDetector;
              private Handler mainHandler;
              private ExecutorService executor;
              private volatile boolean isBusy = false;

              private static class TrackedBox {
                  Rect rect;
                  int[] borderColors;
                  long createdTime;
              }
              private final List<TrackedBox> activeTrackedBoxes = new ArrayList<>();
              private volatile boolean userJustScrolled = false;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  mainHandler = new Handler(Looper.getMainLooper());
                  executor = Executors.newSingleThreadExecutor();

                  try {
                      windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                      overlayView = new CensorOverlayView(this);
                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT
                      );
                      params.gravity = Gravity.TOP | Gravity.START;
                      windowManager.addView(overlayView, params);
                  } catch (Exception ignored) {}

                  FaceDetectorOptions opts = new FaceDetectorOptions.Builder()
                          .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_ACCURATE)
                          .setClassificationMode(FaceDetectorOptions.CLASSIFICATION_MODE_ALL)
                          .setMinFaceSize(0.035f)
                          .build();
                  faceDetector = FaceDetection.getClient(opts);

                  mainHandler.postDelayed(scanLoop, 400);
              }

              private boolean isHomeOrSafeApp() {
                  String p = activePkg.toLowerCase();
                  if (p.isEmpty()) return true;
                  return p.contains("launcher") || p.contains("sec.android.app.launcher")
                          || p.contains("quickstep") || p.contains("com.ghaad.shield")
                          || p.contains("inputmethod") || p.contains("honeyboard")
                          || p.contains("systemui") || p.contains("android.settings")
                          || p.contains("dialer") || p.contains("bkash") || p.contains("nagad");
              }

              private final Runnable scanLoop = new Runnable() {
                  @Override
                  public void run() {
                      if (isHomeOrSafeApp()) {
                          activeTrackedBoxes.clear();
                          overlayView.setBoxes(Collections.emptyList(), false);
                          mainHandler.postDelayed(this, 450);
                          return;
                      }

                      if (!isBusy && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          isBusy = true;
                          captureWithoutBlinking();
                      }
                      mainHandler.postDelayed(this, 1020);
                  }
              };

              private void captureWithoutBlinking() {
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, executor, new TakeScreenshotCallback() {
                          @Override
                          public void onSuccess(ScreenshotResult result) {
                              try {
                                  HardwareBuffer hb = result.getHardwareBuffer();
                                  ColorSpace cs = result.getColorSpace();
                                  Bitmap hwBmp = Bitmap.wrapHardwareBuffer(hb, cs);
                                  if (hwBmp != null) {
                                      int origW = hwBmp.getWidth();
                                      int origH = hwBmp.getHeight();
                                      int smallW = Math.max(160, origW / 2);
                                      int smallH = Math.max(160, origH / 2);
                                      Bitmap softBmp = hwBmp.copy(Bitmap.Config.ARGB_8888, false);
                                      hwBmp.recycle();
                                      hb.close();

                                      Bitmap scaledBmp = Bitmap.createScaledBitmap(softBmp, smallW, smallH, false);
                                      softBmp.recycle();
                                      processFrameZeroFlicker(scaledBmp, origW, origH);
                                  } else {
                                      hb.close();
                                      isBusy = false;
                                  }
                              } catch (Exception e) {
                                  isBusy = false;
                              }
                          }

                          @Override
                          public void onFailure(int errorCode) {
                              isBusy = false;
                          }
                      });
                  } catch (Exception e) {
                      isBusy = false;
                  }
              }

              private void processFrameZeroFlicker(Bitmap bmp, int screenW, int screenH) {
                  final float scaleX = (float) screenW / bmp.getWidth();
                  final float scaleY = (float) screenH / bmp.getHeight();
                  final long now = System.currentTimeMillis();

                  synchronized (activeTrackedBoxes) {
                      if (userJustScrolled) {
                          activeTrackedBoxes.clear();
                          userJustScrolled = false;
                      } else {
                          Iterator<TrackedBox> it = activeTrackedBoxes.iterator();
                          while (it.hasNext()) {
                              TrackedBox tb = it.next();
                              int[] currentBorder = sampleOuterBorder(bmp, tb.rect, scaleX, scaleY);
                              // Release old box if border changed OR after 3.5s so ghost boxes never stick when scene cuts!
                              if (isBorderChangedSignificantly(tb.borderColors, currentBorder) || (now - tb.createdTime > 3500)) {
                                  it.remove();
                              }
                          }
                      }
                  }

                  final List<Rect> skinClusterBoxes = detectExposedBodyClusters(bmp, screenW, screenH, scaleX, scaleY);

                  InputImage image = InputImage.fromBitmap(bmp, 0);
                  faceDetector.process(image)
                          .addOnSuccessListener(faces -> {
                              List<Rect> newlyDetected = new ArrayList<>();
                              List<Rect> maleExclusionZones = new ArrayList<>();

                              // Couple / Kissing check: if 2+ faces are very close together, block both!
                              boolean isCloseCouple = areTwoFacesClose(faces);

                              for (Face face : faces) {
                                  Rect fb = face.getBoundingBox();
                                  int fw = fb.width();
                                  int fh = fb.height();

                                  if (isCloseCouple || isFemaleOrImmodestTarget(bmp, fb)) {
                                      if (blockFemaleFaces || isCloseCouple || hasExposedChestSkin(bmp, fb)) {
                                          int left = Math.max(0, (int) ((fb.left - fw * 0.9f) * scaleX));
                                          int top = Math.max(0, (int) ((fb.top - fh * 0.5f) * scaleY));
                                          int right = Math.min(screenW, (int) ((fb.right + fw * 0.9f) * scaleX));
                                          int bottom = Math.min(screenH, (int) ((fb.bottom + fh * 2.6f) * scaleY));

                                          if (bottom - top > (int) (screenH * 0.55f)) {
                                              bottom = top + (int) (screenH * 0.55f);
                                          }
                                          newlyDetected.add(new Rect(left, top, right, bottom));
                                      }
                                  } else {
                                      // It is a clothed MAN! Create an exclusion zone around his face & hands so skin clusters never block him!
                                      int mLeft = Math.max(0, (int) ((fb.left - fw * 1.5f) * scaleX));
                                      int mTop = Math.max(0, (int) ((fb.top - fh * 0.5f) * scaleY));
                                      int mRight = Math.min(screenW, (int) ((fb.right + fw * 1.5f) * scaleX));
                                      int mBottom = Math.min(screenH, (int) ((fb.bottom + fh * 3.0f) * scaleY));
                                      maleExclusionZones.add(new Rect(mLeft, mTop, mRight, mBottom));
                                  }
                              }

                              // Add body skin clusters ONLY if they do not belong to a clothed man
                              for (Rect sb : skinClusterBoxes) {
                                  boolean isMan = false;
                                  for (Rect mz : maleExclusionZones) {
                                      if (Rect.intersects(sb, mz)) {
                                          isMan = true;
                                          break;
                                      }
                                  }
                                  if (!isMan) {
                                      newlyDetected.add(sb);
                                  }
                              }

                              synchronized (activeTrackedBoxes) {
                                  for (Rect r : newlyDetected) {
                                      TrackedBox tb = new TrackedBox();
                                      tb.rect = r;
                                      tb.borderColors = sampleOuterBorder(bmp, r, scaleX, scaleY);
                                      tb.createdTime = now;
                                      activeTrackedBoxes.add(tb);
                                  }

                                  List<Rect> allRects = new ArrayList<>();
                                  for (TrackedBox tb : activeTrackedBoxes) {
                                      allRects.add(new Rect(tb.rect));
                                  }
                                  List<Rect> merged = mergeBoxesCleanly(allRects, screenW, screenH);

                                  activeTrackedBoxes.clear();
                                  for (Rect mr : merged) {
                                      TrackedBox tb = new TrackedBox();
                                      tb.rect = mr;
                                      tb.borderColors = sampleOuterBorder(bmp, mr, scaleX, scaleY);
                                      tb.createdTime = now;
                                      activeTrackedBoxes.add(tb);
                                  }

                                  mainHandler.post(() -> overlayView.setBoxes(merged, !isHomeOrSafeApp()));
                              }
                              bmp.recycle();
                              isBusy = false;
                          })
                          .addOnFailureListener(e -> {
                              bmp.recycle();
                              isBusy = false;
                          });
              }

              private boolean areTwoFacesClose(List<Face> faces) {
                  if (faces.size() < 2) return false;
                  for (int i = 0; i < faces.size(); i++) {
                      for (int j = i + 1; j < faces.size(); j++) {
                          Rect a = faces.get(i).getBoundingBox();
                          Rect b = faces.get(j).getBoundingBox();
                          Rect exp = new Rect(a.left - a.width(), a.top - a.height() / 2, a.right + a.width(), a.bottom + a.height());
                          if (Rect.intersects(exp, b)) {
                              return true; // Kissing or intimate close-up!
                          }
                      }
                  }
                  return false;
              }

              private boolean hasExposedChestSkin(Bitmap bmp, Rect fb) {
                  int w = bmp.getWidth(), h = bmp.getHeight();
                  int l = Math.max(0, fb.left), r = Math.min(w - 1, fb.right);
                  int b = Math.min(h - 1, fb.bottom);
                  int fw = fb.width(), fh = fb.height();

                  int chestTop = Math.min(h - 1, b + fh / 4);
                  int chestBot = Math.min(h - 1, b + (int)(fh * 2.0f));
                  int chestLeft = Math.max(0, l - fw / 2);
                  int chestRight = Math.min(w - 1, r + fw / 2);

                  int chestSkin = 0, chestTotal = 0;
                  for (int y = chestTop; y <= chestBot; y += 2) {
                      for (int x = chestLeft; x <= chestRight; x += 2) {
                          chestTotal++;
                          if (isSkin(bmp.getPixel(x, y))) chestSkin++;
                      }
                  }
                  return chestTotal > 0 && (chestSkin * 100 / chestTotal) >= 22;
              }

              // FIXED MALE FACE BUG:
              // Never confuses a solid blue/white background wall with a hijab!
              // Checks if the top hair/hijab crown color actually continues down past the jaw/neck AND differs from the outer background wall!
              private boolean isFemaleOrImmodestTarget(Bitmap bmp, Rect fb) {
                  int w = bmp.getWidth(), h = bmp.getHeight();
                  int l = Math.max(0, fb.left), r = Math.min(w - 1, fb.right);
                  int t = Math.max(0, fb.top), b = Math.min(h - 1, fb.bottom);
                  int fw = fb.width(), fh = fb.height();
                  if (fw < 10 || fh < 10) return false;

                  // 1. Verify human skin on face (Rejects logos, icons & text!)
                  int faceSkin = 0, faceTotal = 0;
                  for (int y = t; y <= b; y += 2) {
                      for (int x = l; x <= r; x += 2) {
                          faceTotal++;
                          if (isSkin(bmp.getPixel(x, y))) faceSkin++;
                      }
                  }
                  if (faceTotal == 0 || (faceSkin * 100 / faceTotal) < 20) return false;

                  // 2. Check if chest/shoulder is exposed (Bikini, cleavage, sleeveless, bare back)
                  if (hasExposedChestSkin(bmp, fb)) {
                      return true;
                  }

                  // 3. True Long-Hair / Hijab Check (Excludes background wall & men's short hair!):
                  // Sample crown color right above forehead
                  int crownY = Math.max(0, t - fh / 5);
                  int crownColor = bmp.getPixel(fb.centerX(), crownY);

                  // Sample far background wall color (2 face-widths away)
                  int farWallLeftX = Math.max(0, l - fw);
                  int farWallRightX = Math.min(w - 1, r + fw);
                  int wallColorL = bmp.getPixel(farWallLeftX, fb.centerY());
                  int wallColorR = bmp.getPixel(farWallRightX, fb.centerY());

                  // Check lower jaw / neck sides (below ears, where men have short hair/wall, but women have long hair or hijab)
                  int neckTop = t + (int)(fh * 0.65f);
                  int neckBot = Math.min(h - 1, b + fh / 2);
                  int sideLeftX = Math.max(0, l - fw / 5);
                  int sideRightX = Math.min(w - 1, r + fw / 5);

                  int longHairMatches = 0, samples = 0;
                  for (int y = neckTop; y <= neckBot; y += 2) {
                      samples++;
                      int pxL = bmp.getPixel(sideLeftX, y);
                      int pxR = bmp.getPixel(sideRightX, y);

                      // Must NOT be skin, must match crown hair/hijab color, AND must NOT just be the background wall!
                      boolean leftIsHair = !isSkin(pxL)
                              && colorSimilarity(pxL, crownColor) < 48
                              && colorSimilarity(pxL, wallColorL) > 35;
                      boolean rightIsHair = !isSkin(pxR)
                              && colorSimilarity(pxR, crownColor) < 48
                              && colorSimilarity(pxR, wallColorR) > 35;

                      if (leftIsHair || rightIsHair) {
                          longHairMatches++;
                      }
                  }

                  return samples > 0 && (longHairMatches * 100 / samples) >= 55;
              }

              private List<Rect> detectExposedBodyClusters(Bitmap bmp, int screenW, int screenH, float scaleX, float scaleY) {
                  List<Rect> boxes = new ArrayList<>();
                  int w = bmp.getWidth();
                  int h = bmp.getHeight();
                  int cols = 14, rows = 20;
                  int cellW = w / cols, cellH = h / rows;
                  if (cellW < 4 || cellH < 4) return boxes;

                  boolean[][] skinGrid = new boolean[rows][cols];
                  for (int r = 1; r < rows - 1; r++) {
                      for (int c = 1; c < cols - 1; c++) {
                          int skin = 0, total = 0;
                          for (int dy = 2; dy < cellH; dy += 3) {
                              for (int dx = 2; dx < cellW; dx += 3) {
                                  total++;
                                  if (isSkin(bmp.getPixel(c * cellW + dx, r * cellH + dy))) {
                                      skin++;
                                  }
                              }
                          }
                          if (total > 0 && (skin * 100 / total) >= 52) {
                              skinGrid[r][c] = true;
                          }
                      }
                  }

                  boolean[][] visited = new boolean[rows][cols];
                  for (int r = 1; r < rows - 1; r++) {
                      for (int c = 1; c < cols - 1; c++) {
                          if (skinGrid[r][c] && !visited[r][c]) {
                              int minR = r, maxR = r, minC = c, maxC = c, count = 0;
                              List<int[]> q = new ArrayList<>();
                              q.add(new int[]{r, c});
                              visited[r][c] = true;
                              int idx = 0;
                              while (idx < q.size()) {
                                  int[] cur = q.get(idx++);
                                  count++;
                                  minR = Math.min(minR, cur[0]);
                                  maxR = Math.max(maxR, cur[0]);
                                  minC = Math.min(minC, cur[1]);
                                  maxC = Math.max(maxC, cur[1]);
                                  for (int dr = -1; dr <= 1; dr++) {
                                      for (int dc = -1; dc <= 1; dc++) {
                                          int nr = cur[0] + dr, nc = cur[1] + dc;
                                          if (nr >= 1 && nr < rows - 1 && nc >= 1 && nc < cols - 1
                                                  && skinGrid[nr][nc] && !visited[nr][nc]) {
                                              visited[nr][nc] = true;
                                              q.add(new int[]{nr, nc});
                                          }
                                      }
                                  }
                              }
                              // Require at least 4 connected cells so small logos, hands, or wooden edges are never blocked!
                              if (count >= 4) {
                                  int left = Math.max(0, (int) ((minC * cellW - cellW / 2) * scaleX));
                                  int top = Math.max(0, (int) ((minR * cellH - cellH) * scaleY));
                                  int right = Math.min(screenW, (int) (((maxC + 1) * cellW + cellW / 2) * scaleX));
                                  int bottom = Math.min(screenH, (int) (((maxR + 1) * cellH + cellH) * scaleY));
                                  boxes.add(new Rect(left, top, right, bottom));
                              }
                          }
                      }
                  }
                  return boxes;
              }

              private int[] sampleOuterBorder(Bitmap bmp, Rect screenRect, float scaleX, float scaleY) {
                  int w = bmp.getWidth(), h = bmp.getHeight();
                  int l = Math.max(2, (int) (screenRect.left / scaleX) - 6);
                  int t = Math.max(2, (int) (screenRect.top / scaleY) - 6);
                  int r = Math.min(w - 3, (int) (screenRect.right / scaleX) + 6);
                  int b = Math.min(h - 3, (int) (screenRect.bottom / scaleY) + 6);

                  int[] samples = new int[12];
                  int idx = 0;
                  for (int i = 1; i <= 3; i++) {
                      samples[idx++] = bmp.getPixel(l + (r - l) * i / 4, t);
                      samples[idx++] = bmp.getPixel(l + (r - l) * i / 4, b);
                      samples[idx++] = bmp.getPixel(l, t + (b - t) * i / 4);
                      samples[idx++] = bmp.getPixel(r, t + (b - t) * i / 4);
                  }
                  return samples;
              }

              private boolean isBorderChangedSignificantly(int[] oldB, int[] newB) {
                  if (oldB == null || newB == null || oldB.length != newB.length) return true;
                  int changed = 0;
                  for (int i = 0; i < oldB.length; i++) {
                      if (colorSimilarity(oldB[i], newB[i]) > 60) {
                          changed++;
                      }
                  }
                  return changed >= 5;
              }

              private int colorSimilarity(int c1, int c2) {
                  int r1 = (c1 >> 16) & 0xFF, g1 = (c1 >> 8) & 0xFF, b1 = c1 & 0xFF;
                  int r2 = (c2 >> 16) & 0xFF, g2 = (c2 >> 8) & 0xFF, b2 = c2 & 0xFF;
                  return Math.abs(r1 - r2) + Math.abs(g1 - g2) + Math.abs(b1 - b2);
              }

              private boolean isSkin(int px) {
                  int R = (px >> 16) & 0xFF;
                  int G = (px >> 8) & 0xFF;
                  int B = px & 0xFF;
                  if (R > 80 && G > 35 && B > 20 && R > G && G > B && (R - G) > 14 && (R - B) < 115) {
                      int Cr = 128 + ((112 * R - 93 * G - 18 * B) >> 8);
                      int Cb = 128 + ((-37 * R - 74 * G + 112 * B) >> 8);
                      return Cr >= 135 && Cr <= 172 && Cb >= 82 && Cb <= 124;
                  }
                  return false;
              }

              private List<Rect> mergeBoxesCleanly(List<Rect> boxes, int screenW, int screenH) {
                  if (boxes.size() <= 1) return boxes;
                  List<Rect> merged = new ArrayList<>(boxes);
                  boolean changed = true;
                  while (changed) {
                      changed = false;
                      for (int i = 0; i < merged.size(); i++) {
                          for (int j = i + 1; j < merged.size(); j++) {
                              Rect a = merged.get(i);
                              Rect b = merged.get(j);
                              if (Rect.intersects(a, b)) {
                                  Rect u = new Rect(a);
                                  u.union(b);
                                  if (u.height() < (int) (screenH * 0.70f)) {
                                      merged.set(i, u);
                                      merged.remove(j);
                                      changed = true;
                                      break;
                                  }
                              }
                          }
                          if (changed) break;
                      }
                  }
                  return merged;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  if (event.getEventType() == AccessibilityEvent.TYPE_VIEW_SCROLLED) {
                      userJustScrolled = true;
                  }

                  if (event.getPackageName() != null) {
                      String pkg = event.getPackageName().toString();
                      if (!pkg.contains("systemui")) {
                          activePkg = pkg;
                      }
                      if (isHomeOrSafeApp()) {
                          activeTrackedBoxes.clear();
                          overlayView.setBoxes(Collections.emptyList(), false);
                      }
                  }

                  if (System.currentTimeMillis() < pauseLockUntil) return;

                  // Exact V10.2 Settings Guard (Only inside Settings / PackageInstaller)
                  String pkg = activePkg.toLowerCase();
                  if (pkg.equals("com.android.settings") || pkg.contains("packageinstaller")) {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root != null) {
                          String text = collectText(root).toLowerCase();
                          root.recycle();
                          if (text.contains("ghaad v10 shield")) {
                              if (text.contains("uninstall") || text.contains("force stop")
                                      || text.contains("deactivate") || text.contains("app info")) {
                                  performGlobalAction(GLOBAL_ACTION_BACK);
                                  performGlobalAction(GLOBAL_ACTION_HOME);
                              }
                          }
                      }
                  }
              }

              private String collectText(AccessibilityNodeInfo node) {
                  if (node == null) return "";
                  StringBuilder sb = new StringBuilder();
                  if (node.getText() != null) sb.append(node.getText()).append(" ");
                  if (node.getContentDescription() != null) sb.append(node.getContentDescription()).append(" ");
                  int count = node.getChildCount();
                  for (int i = 0; i < count; i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) {
                          sb.append(collectText(child));
                          child.recycle();
                      }
                  }
                  return sb.toString();
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              @Override
              public void onInterrupt() {}
          }
