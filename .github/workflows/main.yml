                          : new NudeNetOnnxDetector.NudeNetResult();

                  // ENGINE 2: YCbCr Bare-Back, Bikini, Bra & Intimate Torso Skin Cluster Detector
                  // (Catches 00:04-00:18 Swimsuits, 00:24-00:38 Red Bra, 00:52/00:58 Bare Back, 01:18 Belly Kiss!)
                  final List<Rect> skinClusterBoxes = detectExposedBodyAndBackClusters(smallBmp, screenW, screenH, scaleX, scaleY);

                  // ENGINE 3: Google ML Kit Face & Kissing/Intimacy Detector
                  InputImage inputImage = InputImage.fromBitmap(smallBmp, 0);
                  faceDetector.process(inputImage)
                          .addOnSuccessListener(faces -> {
                              List<Rect> combinedBoxes = new ArrayList<>(nnRes.targetBoxes);
                              List<Rect> soloClothedMen = new ArrayList<>();

                              // Check if there are 2+ faces close together (Kissing / Couple scene like 00:20-01:14!)
                              boolean isCoupleOrMultiFaceScene = faces.size() >= 2;

                              for (Face face : faces) {
                                  Rect fb = face.getBoundingBox();
                                  float tiltZ = Math.abs(face.getHeadEulerAngleZ());
                                  float turnY = Math.abs(face.getHeadEulerAngleY());

                                  int fw = fb.width();
                                  int fh = fb.height();
                                  Rect screenFaceRect = new Rect(
                                          Math.max(0, (int) (fb.left * scaleX)),
                                          Math.max(0, (int) (fb.top * scaleY)),
                                          Math.min(screenW, (int) (fb.right * scaleX)),
                                          Math.min(screenH, (int) (fb.bottom * scaleY))
                                  );

                                  // Check skin exposure below the chin (chest, shoulders, torso)
                                  int torsoSkinPct = getTorsoSkinPercentage(smallBmp, fb);

                                  // Check if this face is a SOLO upright clothed man (e.g. lecture, news, tutorial)
                                  boolean isSoloUprightClothedMan = !isCoupleOrMultiFaceScene
                                          && tiltZ < 16.0f
                                          && torsoSkinPct < 15
