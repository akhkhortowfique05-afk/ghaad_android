                                      int right = Math.min(screenW, (int) ((fb.right + fw * 0.95f) * scaleX));
                                      int bottom = Math.min(screenH, (int) ((fb.bottom + fh * 2.80f) * scaleY));
                                      if (bottom - top > (int) (screenH * 0.62f)) {
                                          bottom = top + (int) (screenH * 0.62f);
                                      }
                                      Rect fScreen = new Rect(left, top, right, bottom);
                                      femaleFaceRects.add(fScreen);
                                      newlyDetected.add(fScreen);
