              private boolean hasDarkBeardOnChin(Bitmap bmp, Rect fb) {
                  int w = bmp.getWidth(), h = bmp.getHeight();
                  int fw = fb.width(), fh = fb.height();
                  int x1 = Math.max(0, fb.left + fw / 4);
                  int x2 = Math.min(w - 1, fb.right - fw / 4);
                  int upperY1 = Math.max(0, fb.top + fh / 5);
                  int upperY2 = Math.min(h - 1, fb.top + fh / 2);
                  int lowerY1 = Math.max(0, fb.top + fh * 2 / 3);
                  int lowerY2 = Math.min(h - 1, fb.bottom);

                  long upperLum = 0, upperCnt = 0;
                  for (int y = upperY1; y <= upperY2; y += 2) {
                      for (int x = x1; x <= x2; x += 2) {
                          int px = bmp.getPixel(x, y);
                          upperLum += (((px >> 16) & 0xFF) * 299 + ((px >> 8) & 0xFF) * 587 + (px & 0xFF) * 114) / 1000;
                          upperCnt++;
                      }
                  }
                  long lowerLum = 0, lowerCnt = 0;
                  for (int y = lowerY1; y <= lowerY2; y += 2) {
                      for (int x = x1; x <= x2; x += 2) {
                          int px = bmp.getPixel(x, y);
                          lowerLum += (((px >> 16) & 0xFF) * 299 + ((px >> 8) & 0xFF) * 587 + (px & 0xFF) * 114) / 1000;
                          lowerCnt++;
                      }
                  }
                  return upperCnt > 0 && lowerCnt > 0 && ((upperLum / upperCnt) - (lowerLum / lowerCnt)) >= 26;
              }

              private Rect findActiveVideoArea(Bitmap bmp) {
                  int w = bmp.getWidth();
                  int h = bmp.getHeight();
                  if (w > h) return new Rect(0, 0, w, h);

                  int topBar = 0, botBar = h;
                  for (int y = h / 10; y < h * 4 / 10; y += 6) {
                      int bright = 0;
                      for (int x = w / 5; x < w * 4 / 5; x += 12) {
                          int px = bmp.getPixel(x, y);
                          if (((px >> 16) & 0xFF) > 22 || ((px >> 8) & 0xFF) > 22 || (px & 0xFF) > 22) bright++;
                      }
                      if (bright >= 3) { topBar = Math.max(0, y - 10); break; }
                  }
                  for (int y = h * 9 / 10; y > h * 6 / 10; y -= 6) {
                      int bright = 0;
                      for (int x = w / 5; x < w * 4 / 5; x += 12) {
                          int px = bmp.getPixel(x, y);
                          if (((px >> 16) & 0xFF) > 22 || ((px >> 8) & 0xFF) > 22 || (px & 0xFF) > 22) bright++;
                      }
                      if (bright >= 3) { botBar = Math.min(h, y + 10); break; }
                  }
                  if (botBar - topBar < h / 4) return new Rect(0, 0, w, h);
                  return new Rect(0, topBar, w, botBar);
              }

              public List<Rect> detectExposedBodies(Bitmap fullBmp, int screenW, int screenH) {
