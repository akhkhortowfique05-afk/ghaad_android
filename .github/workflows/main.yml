                                  int top = Math.max(0, (int) (((minR - 1) * cellH) * scaleY));
                                  int right = Math.min(screenW, (int) (((maxC + 2) * cellW) * scaleX));
                                  int bottom = Math.min(screenH, (int) (((maxR + 2) * cellH) * scaleY));
                                  boxes.add(new Rect(left, top, right, bottom));
                              }
                          }
                      }
                  }
