                                  // Otherwise: It's a Woman, OR a Kissing/Couple Scene, OR Tilted/Intimate Pose, OR High Skin Exposure!
                                  if (NudeNetOnnxDetector.blockFemaleFaceClass1 || torsoSkinPct >= 15 || tiltZ >= 16.0f || isCoupleOrMultiFaceScene) {
                                      int left = Math.max(0, (int) ((fb.left - fw * 1.3f) * scaleX));
                                      int top = Math.max(0, (int) ((fb.top - fh * 0.6f) * scaleY));
                                      int right = Math.min(screenW, (int) ((fb.right + fw * 1.3f) * scaleX));
                                      int bottom = Math.min(screenH, (int) ((fb.bottom + fh * 3.8f) * scaleY));
                                      combinedBoxes.add(new Rect(left, top, right, bottom));
                                  }
                              }

                              // Add Bare-Back / Bikini / Bra / Intimate Skin Clusters (excluding solo clothed man's face)
