              private boolean hasSunglassesAndHijabWrap(Bitmap bmp, Face face, Rect fb) {
                  Float leftEye = face.getLeftEyeOpenProbability();
                  Float rightEye = face.getRightEyeOpenProbability();
                  boolean eyesHiddenBySunglasses = (leftEye != null && rightEye != null && leftEye < 0.25f && rightEye < 0.25f);
                  if (!eyesHiddenBySunglasses) return false;

                  int w = bmp.getWidth(), h = bmp.getHeight();
                  int fw = fb.width(), fh = fb.height();
                  int crownColor = bmp.getPixel(Math.min(w - 1, Math.max(0, fb.centerX())), Math.max(0, fb.top - fh / 6));
                  int chinBelowColor = bmp.getPixel(Math.min(w - 1, Math.max(0, fb.centerX())), Math.min(h - 1, fb.bottom + fh / 3));

                  int diff = Math.abs(((crownColor >> 16) & 0xFF) - ((chinBelowColor >> 16) & 0xFF))
                           + Math.abs(((crownColor >> 8) & 0xFF) - ((chinBelowColor >> 8) & 0xFF))
                           + Math.abs((crownColor & 0xFF) - (chinBelowColor & 0xFF));
                  return diff < 55 && !isSkinPixel(chinBelowColor);
              }

              private List<Rect> detectActiveVideoSkinClusters(Bitmap bmp, Rect activeBounds, int screenW, int screenH, float scaleX, float scaleY) {
                  List<Rect> boxes = new ArrayList<>();
                  int startX = activeBounds.left, startY = activeBounds.top;
                  int aw = activeBounds.width(), ah = activeBounds.height();
                  int cols = 16, rows = 16;
                  int cellW = aw / cols, cellH = ah / rows;
                  if (cellW < 4 || cellH < 4) return boxes;

                  boolean[][] grid = new boolean[rows][cols];
                  for (int r = 1; r < rows - 1; r++) {
                      for (int c = 1; c < cols - 1; c++) {
                          int skin = 0, total = 0;
                          for (int dy = 1; dy < cellH; dy += 2) {
                              for (int dx = 1; dx < cellW; dx += 2) {
                                  total++;
                                  if (isSkinPixel(bmp.getPixel(startX + c * cellW + dx, startY + r * cellH + dy))) {
                                      skin++;
                                  }
                              }
                          }
                          if (total > 0 && (skin * 100 / total) >= 45) {
                              grid[r][c] = true;
                          }
                      }
                  }

                  boolean[][] visited = new boolean[rows][cols];
                  for (int r = 1; r < rows - 1; r++) {
                      for (int c = 1; c < cols - 1; c++) {
                          if (grid[r][c] && !visited[r][c]) {
                              int minR = r, maxR = r, minC = c, maxC = c, count = 0;
                              List<int[]> q = new ArrayList<>();
                              q.add(new int[]{r, c});
                              visited[r][c] = true;
                              int idx = 0;
                              while (idx < q.size()) {
                                  int[] cur = q.get(idx++);
                                  count++;
                                  minR = Math.min(minR, cur[0]); maxR = Math.max(maxR, cur[0]);
                                  minC = Math.min(minC, cur[1]); maxC = Math.max(maxC, cur[1]);
                                  for (int dr = -1; dr <= 1; dr++) {
                                      for (int dc = -1; dc <= 1; dc++) {
                                          int nr = cur[0] + dr, nc = cur[1] + dc;
                                          if (nr >= 1 && nr < rows - 1 && nc >= 1 && nc < cols - 1
                                                  && grid[nr][nc] && !visited[nr][nc]) {
                                              visited[nr][nc] = true;
                                              q.add(new int[]{nr, nc});
                                          }
                                      }
                                  }
                              }
                              if (count >= 3) {
                                  int left = Math.max(0, (int) ((startX + (minC - 1) * cellW) * scaleX));
                                  int top = Math.max(0, (int) ((startY + (minR - 1) * cellH) * scaleY));
                                  int right = Math.min(screenW, (int) ((startX + (maxC + 2) * cellW) * scaleX));
                                  int bottom = Math.min(screenH, (int) ((startY + (maxR + 2) * cellH) * scaleY));
                                  boxes.add(new Rect(left, top, right, bottom));
                              }
                          }
                      }
                  }
                  return boxes;
              }

              private boolean isSkinPixel(int px) {
                  int R = (px >> 16) & 0xFF, G = (px >> 8) & 0xFF, B = px & 0xFF;
                  if (R > 75 && G > 32 && B > 18 && R > G && G >= B && (R - G) >= 12 && (R - B) <= 125) {
                      int Cr = 128 + ((112 * R - 93 * G - 18 * B) >> 8);
                      int Cb = 128 + ((-37 * R - 74 * G + 112 * B) >> 8);
                      return Cr >= 133 && Cr <= 174 && Cb >= 79 && Cb <= 126;
                  }
                  return false;
              }

              private int getChestSkinPercentage(Bitmap bmp, Rect fb) {
                  int w = bmp.getWidth(), h = bmp.getHeight();
                  int fw = fb.width(), fh = fb.height();
                  int top = Math.min(h - 1, fb.bottom + fh / 5);
                  int bot = Math.min(h - 1, fb.bottom + (int) (fh * 2.0f));
                  int left = Math.max(0, fb.left - fw / 2);
                  int right = Math.min(w - 1, fb.right + fw / 2);

                  int skin = 0, total = 0;
                  for (int y = top; y <= bot; y += 2) {
                      for (int x = left; x <= right; x += 2) {
                          total++;
                          if (isSkinPixel(bmp.getPixel(x, y))) skin++;
                      }
                  }
                  return total > 0 ? (skin * 100 / total) : 0;
              }

              private boolean intersectsAny(Rect target, List<Rect> zones) {
                  for (Rect r : zones) {
                      if (Rect.intersects(target, r)) return true;
                  }
                  return false;
              }

              private int[] sampleOuterBorder(Bitmap bmp, Rect screenRect, float scaleX, float scaleY) {
                  int w = bmp.getWidth(), h = bmp.getHeight();
                  int l = Math.max(2, (int) (screenRect.left / scaleX) - 8);
                  int t = Math.max(2, (int) (screenRect.top / scaleY) - 8);
                  int r = Math.min(w - 3, (int) (screenRect.right / scaleX) + 8);
                  int b = Math.min(h - 3, (int) (screenRect.bottom / scaleY) + 8);

                  int[] sig = new int[12];
                  int idx = 0;
                  for (int i = 1; i <= 3; i++) {
                      sig[idx++] = bmp.getPixel(l + (r - l) * i / 4, t);
                      sig[idx++] = bmp.getPixel(l + (r - l) * i / 4, b);
                      sig[idx++] = bmp.getPixel(l, t + (b - t) * i / 4);
                      sig[idx++] = bmp.getPixel(r, t + (b - t) * i / 4);
                  }
                  return sig;
              }

              private boolean isSceneChangedOutsideBox(int[] oldSig, int[] newSig) {
                  if (oldSig == null || newSig == null || oldSig.length != newSig.length) return true;
                  int diffCount = 0;
                  for (int i = 0; i < oldSig.length; i++) {
                      int c1 = oldSig[i], c2 = newSig[i];
                      int diff = Math.abs(((c1 >> 16) & 0xFF) - ((c2 >> 16) & 0xFF))
                               + Math.abs(((c1 >> 8) & 0xFF) - ((c2 >> 8) & 0xFF))
                               + Math.abs((c1 & 0xFF) - (c2 & 0xFF));
                      if (diff > 55) diffCount++;
                  }
                  return diffCount >= 5;
              }

              private List<Rect> mergeBoxesCleanly(List<Rect> boxes, int screenH) {
                  if (boxes.size() <= 1) return boxes;
                  List<Rect> merged = new ArrayList<>(boxes);
                  boolean changed = true;
                  while (changed) {
                      changed = false;
                      for (int i = 0; i < merged.size(); i++) {
                          for (int j = i + 1; j < merged.size(); j++) {
                              Rect a = merged.get(i);
                              Rect b = merged.get(j);
                              if (Rect.intersects(a, b)) {
                                  Rect u = new Rect(a);
                                  u.union(b);
                                  if (u.height() < (int) (screenH * 0.68f)) {
                                      merged.set(i, u);
                                      merged.remove(j);
                                      changed = true;
                                      break;
                                  }
                              }
                          }
                          if (changed) break;
                      }
                  }
                  return merged;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  if (event.getEventType() == AccessibilityEvent.TYPE_VIEW_SCROLLED) {
                      userScrolled = true;
                  }
                  if (event.getPackageName() != null) {
                      String pkg = event.getPackageName().toString();
                      if (!pkg.contains("systemui")) {
                          activePkg = pkg;
                      }
                      if (isHomeOrSafeApp()) {
                          synchronized (activeLockedBoxes) { activeLockedBoxes.clear(); }
                          overlayView.setBoxes(Collections.emptyList(), false);
                      }
                  }

                  if (System.currentTimeMillis() < pauseLockUntil) return;

                  String pkg = activePkg.toLowerCase();
                  if (pkg.equals("com.android.settings") || pkg.contains("packageinstaller")) {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root != null) {
                          String text = collectBrowserText(root, 0).toLowerCase();
                          root.recycle();
                          if (text.contains("ghaad v26 shield")) {
                              if (text.contains("uninstall") || text.contains("force stop")
                                      || text.contains("deactivate") || text.contains("app info")) {
                                  performGlobalAction(GLOBAL_ACTION_BACK);
                                  performGlobalAction(GLOBAL_ACTION_HOME);
                              }
                          }
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              @Override
              public void onInterrupt() {}
          }
