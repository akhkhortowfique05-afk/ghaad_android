name: Build Ghaad V26 Final Production APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python to Export Dedicated YOLOv8-Gender & NudeNet ONNX
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate V26 Final Android Project
        run: |
          mkdir -p android_build/app/src/main/java/com/ghaad/shield
          mkdir -p android_build/app/src/main/res/xml
          mkdir -p android_build/app/src/main/assets

          curl -L -s -o best_Gender_classification.pt "https://huggingface.co/DhanushSGowda/yolov8n-gender-classification/resolve/main/best_Gender_classification.pt"
          pip install --quiet ultralytics nudenet onnx onnxruntime numpy

          python3 - << 'PYEOF'
          import os, onnx, nudenet
          from onnx import version_converter
          from ultralytics import YOLO
          import onnxruntime as ort

          def make_ir8(src, dst):
              m = onnx.load(src)
              m.ir_version = 8
              try:
                  if m.opset_import[0].version > 17:
                      m = version_converter.convert_version(m, 17)
                      m.ir_version = 8
              except Exception:
                  pass
              onnx.save(m, dst)
              sess = ort.InferenceSession(dst)
              print("Verified ONNX:", dst, sess.get_inputs()[0].shape)

          gender_model = YOLO('best_Gender_classification.pt')
          gender_model.export(format='onnx', imgsz=128, opset=15)
          make_ir8('best_Gender_classification.onnx', 'android_build/app/src/main/assets/gender_cls.onnx')

          pkg_dir = os.path.dirname(nudenet.__file__)
          onnx_files = [f for f in os.listdir(pkg_dir) if f.endswith('.onnx')]
          make_ir8(os.path.join(pkg_dir, onnx_files[0]), 'android_build/app/src/main/assets/nudenet.onnx')
          PYEOF

          cat << 'EOF' > android_build/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GhaadV26Final"
          include ':app'
          EOF

          cat << 'EOF' > android_build/build.gradle
          plugins {
              id 'com.android.application' version '8.1.2' apply false
          }
          EOF

          cat << 'EOF' > android_build/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3072m
          EOF

          cat << 'EOF' > android_build/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ghaad.shield'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ghaad.shield"
                  minSdk 24
                  targetSdk 33
                  versionCode 81
