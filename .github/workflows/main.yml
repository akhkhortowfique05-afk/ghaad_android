                  int blackCount = 0, total = 0;
                  for (int y = h / 5; y < h * 4 / 5; y += 14) {
                      for (int x = w / 8; x < w * 7 / 8; x += 14) {
                          total++;
                          int px = bmp.getPixel(x, y);
                          int R = (px >> 16) & 0xFF, G = (px >> 8) & 0xFF, B = px & 0xFF;
                          if (R < 6 && G < 6 && B < 6) {
                              blackCount++;
                          }
                      }
                  }
                  return total > 0 && (blackCount * 100 / total) >= 95;
              }

              private void processFrameV26(Bitmap bmp, int capW, int capH) {
                  final int screenW = overlayView.getWidth() > 0 ? overlayView.getWidth() : capW;
                  final int screenH = overlayView.getHeight() > 0 ? overlayView.getHeight() : capH;
