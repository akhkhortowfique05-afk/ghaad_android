name: Build Ghaad V16 OrtException-Fixed APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python to Convert & Verify NudeNet ONNX
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate V16 OrtException-Fixed Android Project
        run: |
          mkdir -p android_build/app/src/main/java/com/ghaad/shield
          mkdir -p android_build/app/src/main/res/xml
          mkdir -p android_build/app/src/main/assets

          # Install NudeNet & ONNX, downgrade IR version to 8 & Opset to 15 so Android OrtSession NEVER throws OrtException!
          pip install --quiet nudenet onnx onnxruntime numpy
          python3 - << 'PYEOF'
          import os, onnx, nudenet
          from onnx import version_converter
          import onnxruntime as ort
          import numpy as np

          pkg_dir = os.path.dirname(nudenet.__file__)
          onnx_files = [f for f in os.listdir(pkg_dir) if f.endswith('.onnx')]
          src_path = os.path.join(pkg_dir, onnx_files[0])
          print("Original ONNX:", src_path)

          model = onnx.load(src_path)
          print("Original IR version:", model.ir_version, "Opset:", model.opset_import[0].version)

          # Force Android-compatible IR Version 8
          model.ir_version = 8
          try:
              if model.opset_import[0].version > 17:
                  model = version_converter.convert_version(model, 17)
                  model.ir_version = 8
          except Exception as e:
              print("Opset keep:", e)

          target_path = 'android_build/app/src/main/assets/nudenet.onnx'
          onnx.save(model, target_path)

          # Verify with ONNX Runtime
          sess = ort.InferenceSession(target_path)
          in_name = sess.get_inputs()[0].name
          dummy = np.zeros((1, 3, 320, 320), dtype=np.float32)
          out = sess.run(None, {in_name: dummy})
          print("Verified Output Shape:", out[0].shape, "Final File Size:", os.path.getsize(target_path))
          PYEOF

          cat << 'EOF' > android_build/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GhaadShieldV16"
          include ':app'
          EOF

          cat << 'EOF' > android_build/build.gradle
          plugins {
              id 'com.android.application' version '8.1.2' apply false
          }
          EOF

          cat << 'EOF' > android_build/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3072m
          EOF

          cat << 'EOF' > android_build/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ghaad.shield'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ghaad.shield"
                  minSdk 24
                  targetSdk 33
                  versionCode 19
                  versionName "16.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              aaptOptions {
                  noCompress "onnx"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              // Upgraded to latest ONNX Runtime 1.19.2 so all modern ONNX ops & IR versions work seamlessly!
              implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>

              <application
                  android:label="Ghaad V16 Shield"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service android:name=".GhaadGuardService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_build/app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="false"
              android:canTakeScreenshot="true"
              android:notificationTimeout="40"/>
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/CensorOverlayView.java
          package com.ghaad.shield;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.view.View;
          import java.util.ArrayList;
          import java.util.List;

          public class CensorOverlayView extends View {
              private final List<Rect> blockedRects = new ArrayList<>();
              private final Paint boxPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint borderPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint hudBgPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint hudTextPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private String debugText = "V16: STARTING...";

              public CensorOverlayView(Context context) {
                  super(context);
                  boxPaint.setColor(Color.BLACK);
                  boxPaint.setAlpha(255);
                  boxPaint.setStyle(Paint.Style.FILL);

                  borderPaint.setColor(Color.rgb(220, 38, 38));
                  borderPaint.setStyle(Paint.Style.STROKE);
                  borderPaint.setStrokeWidth(4f);

                  textPaint.setColor(Color.WHITE);
                  textPaint.setTextSize(30f);
                  textPaint.setTextAlign(Paint.Align.CENTER);
                  textPaint.setFakeBoldText(true);

                  hudBgPaint.setColor(Color.argb(210, 15, 23, 42));
                  hudBgPaint.setStyle(Paint.Style.FILL);

                  hudTextPaint.setColor(Color.rgb(52, 211, 153));
                  hudTextPaint.setTextSize(22f);
                  hudTextPaint.setFakeBoldText(true);
              }

              public synchronized void updateState(List<Rect> rects, String hud) {
                  if (rects != null) {
                      blockedRects.clear();
                      blockedRects.addAll(rects);
                  }
                  if (hud != null) {
                      debugText = hud;
                  }
                  postInvalidate();
              }

              @Override
              protected synchronized void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  for (Rect r : blockedRects) {
                      RectF rf = new RectF(r);
                      canvas.drawRoundRect(rf, 14f, 14f, boxPaint);
                      canvas.drawRoundRect(rf, 14f, 14f, borderPaint);
                      canvas.drawText("GHAAD BLOCKED", r.centerX(), r.centerY(), textPaint);
                  }
                  if (debugText != null && !debugText.isEmpty()) {
                      canvas.drawRoundRect(16, 85, 760, 132, 10, 10, hudBgPaint);
                      canvas.drawText(debugText, 28, 117, hudTextPaint);
                  }
              }
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/NudeNetOnnxDetector.java
          package com.ghaad.shield;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Rect;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.nio.FloatBuffer;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          import ai.onnxruntime.OnnxTensor;
          import ai.onnxruntime.OrtEnvironment;
          import ai.onnxruntime.OrtSession;

          public class NudeNetOnnxDetector {
              private OrtEnvironment env;
              private OrtSession session;
              private String inputName;
              private boolean isLoaded = false;
              public String statusMsg = "LOADING...";
              public float lastMaxScore = 0f;
              public int lastBestClass = -1;

              // Toggleable option for Class 16 (FEMALE_BREAST_COVERED)
              public static volatile boolean includeCleavageClass16 = false;

              // User requested classes: EXCLUDE 1, 8, 9, 10, 12, 16; KEEP ALL OTHERS ACTIVE:
              // 0: FEMALE_GENITALIA_COVERED, 2: BUTTOCKS_EXPOSED, 3: FEMALE_BREAST_EXPOSED,
              // 4: FEMALE_GENITALIA_EXPOSED, 5: MALE_BREAST_EXPOSED, 6: ANUS_EXPOSED,
              // 7: FEET_EXPOSED, 11: ARMPITS_EXPOSED, 13: BELLY_EXPOSED,
              // 14: MALE_GENITALIA_EXPOSED, 15: ANUS_COVERED, 17: BUTTOCKS_COVERED
              private static final int[] CORE_CLASSES = {
                  0, 2, 3, 4, 5, 6, 7, 11, 13, 14, 15, 17
              };

              public NudeNetOnnxDetector(Context context) {
                  try {
                      env = OrtEnvironment.getEnvironment();
                      File modelFile = new File(context.getFilesDir(), "nudenet_v16_ir8.onnx");
                      // Always overwrite once to ensure new IR8 converted model is used
                      if (!modelFile.exists() || modelFile.length() < 1000000) {
                          InputStream is = context.getAssets().open("nudenet.onnx");
                          FileOutputStream fos = new FileOutputStream(modelFile);
                          byte[] buf = new byte[32768];
                          int len;
                          while ((len = is.read(buf)) != -1) {
                              fos.write(buf, 0, len);
                          }
                          fos.flush();
                          fos.close();
                          is.close();
                      }
                      OrtSession.SessionOptions opts = new OrtSession.SessionOptions();
                      opts.setIntraOpNumThreads(2);
                      session = env.createSession(modelFile.getAbsolutePath(), opts);
                      inputName = session.getInputNames().iterator().next();
                      isLoaded = true;
                      statusMsg = "ONNX READY (" + (modelFile.length() / 1024 / 1024) + "MB)";
                  } catch (Exception e) {
                      isLoaded = false;
                      String msg = e.getMessage() != null ? e.getMessage() : e.getClass().getSimpleName();
                      if (msg.length() > 38) msg = msg.substring(0, 38);
                      statusMsg = "ERR: " + msg;
                  }
              }

              public boolean isReady() {
                  return isLoaded && session != null;
              }

              public List<Rect> detect(Bitmap srcBmp, int screenW, int screenH) {
                  if (!isReady()) return Collections.emptyList();
                  List<Rect> results = new ArrayList<>();
                  try {
                      int origW = srcBmp.getWidth();
                      int origH = srcBmp.getHeight();

                      // Letterbox resize to 320x320 preserving aspect ratio
                      float r = Math.min(320.0f / origW, 320.0f / origH);
                      int newUnpadW = Math.round(origW * r);
                      int newUnpadH = Math.round(origH * r);

                      Bitmap resized = Bitmap.createScaledBitmap(srcBmp, newUnpadW, newUnpadH, true);
                      Bitmap letterboxed = Bitmap.createBitmap(320, 320, Bitmap.Config.ARGB_8888);
                      Canvas canvas = new Canvas(letterboxed);
                      canvas.drawColor(Color.rgb(114, 114, 114));
                      canvas.drawBitmap(resized, 0, 0, null);
                      resized.recycle();

                      int[] pixels = new int[320 * 320];
                      letterboxed.getPixels(pixels, 0, 320, 0, 0, 320, 320);
                      letterboxed.recycle();

                      FloatBuffer floatBuffer = FloatBuffer.allocate(3 * 320 * 320);
                      int area = 320 * 320;
                      for (int i = 0; i < area; i++) {
                          int px = pixels[i];
                          int R = (px >> 16) & 0xFF;
                          int G = (px >> 8) & 0xFF;
                          int B = px & 0xFF;
                          floatBuffer.put(i, R / 255.0f);
                          floatBuffer.put(area + i, G / 255.0f);
                          floatBuffer.put(2 * area + i, B / 255.0f);
                      }
                      floatBuffer.rewind();

                      long[] shape = new long[]{1, 3, 320, 320};
                      OnnxTensor tensor = OnnxTensor.createTensor(env, floatBuffer, shape);
                      OrtSession.Result ortResult = session.run(Collections.singletonMap(inputName, tensor));
                      Object rawOut = ortResult.get(0).getValue();

                      float[][] preds;
                      if (rawOut instanceof float[][][]) {
                          float[][][] out3d = (float[][][]) rawOut;
                          if (out3d[0].length == 22) {
                              int anchors = out3d[0][0].length;
                              preds = new float[anchors][22];
                              for (int a = 0; a < anchors; a++) {
                                  for (int c = 0; c < 22; c++) {
                                      preds[a][c] = out3d[0][c][a];
                                  }
                              }
                          } else {
                              preds = out3d[0];
                          }
                      } else {
                          tensor.close();
                          ortResult.close();
                          return Collections.emptyList();
                      }
                      tensor.close();
                      ortResult.close();

                      float frameMax = 0f;
                      int frameBestClass = -1;
                      float scaleToScreenX = (float) screenW / newUnpadW;
                      float scaleToScreenY = (float) screenH / newUnpadH;

                      for (int i = 0; i < preds.length; i++) {
                          float[] row = preds[i];
                          float bestScore = 0f;
                          int bestCls = -1;

                          for (int c : CORE_CLASSES) {
                              if (row[4 + c] > bestScore) {
                                  bestScore = row[4 + c];
                                  bestCls = c;
                              }
                          }
                          if (includeCleavageClass16 && row[4 + 16] > bestScore) {
                              bestScore = row[4 + 16];
                              bestCls = 16;
                          }

                          if (bestScore > frameMax) {
                              frameMax = bestScore;
                              frameBestClass = bestCls;
                          }

                          if (bestScore >= 0.22f) {
                              float cx = row[0];
                              float cy = row[1];
                              float w = row[2];
                              float h = row[3];

                              if (cx <= 1.05f && cy <= 1.05f && w <= 1.05f && h <= 1.05f) {
                                  cx *= 320.0f;
                                  cy *= 320.0f;
                                  w *= 320.0f;
                                  h *= 320.0f;
                              }

                              float x1 = (cx - w / 2.0f) * scaleToScreenX;
                              float y1 = (cy - h / 2.0f) * scaleToScreenY;
                              float x2 = (cx + w / 2.0f) * scaleToScreenX;
                              float y2 = (cy + h / 2.0f) * scaleToScreenY;

                              int bw = Math.round(x2 - x1);
                              int bh = Math.round(y2 - y1);
                              int padX = (int) (bw * 0.35f);
                              int padY = (int) (bh * 0.35f);

                              int left = Math.max(0, Math.round(x1) - padX);
                              int top = Math.max(0, Math.round(y1) - padY);
                              int right = Math.min(screenW, Math.round(x2) + padX);
                              int bottom = Math.min(screenH, Math.round(y2) + padY);

                              if (right > left + 20 && bottom > top + 20) {
                                  results.add(new Rect(left, top, right, bottom));
                              }
                          }
                      }
                      lastMaxScore = frameMax;
                      lastBestClass = frameBestClass;
                  } catch (Exception e) {
                      statusMsg = "RUN ERR: " + e.getClass().getSimpleName();
                  }
                  return results;
              }
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/GhaadGuardService.java
          package com.ghaad.shield;

          import android.accessibilityservice.AccessibilityService;
          import android.graphics.Bitmap;
          import android.graphics.ColorSpace;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.hardware.HardwareBuffer;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class GhaadGuardService extends AccessibilityService {
              public static GhaadGuardService instance;
              public static volatile String activePkg = "";

              private WindowManager windowManager;
              private CensorOverlayView overlayView;
              private NudeNetOnnxDetector nudeNetDetector;
              private Handler mainHandler;
              private ExecutorService executor;
              private volatile boolean isBusy = false;
              private int scanCounter = 0;

              private static class TrackedBox {
                  Rect rect;
                  int[] borderColors;
              }
              private final List<TrackedBox> activeTrackedBoxes = new ArrayList<>();
              private volatile boolean userJustScrolled = false;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  mainHandler = new Handler(Looper.getMainLooper());
                  executor = Executors.newSingleThreadExecutor();

                  try {
                      windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                      overlayView = new CensorOverlayView(this);
                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT
                      );
                      params.gravity = Gravity.TOP | Gravity.START;
                      windowManager.addView(overlayView, params);
                  } catch (Exception ignored) {}

                  executor.execute(() -> {
                      nudeNetDetector = new NudeNetOnnxDetector(GhaadGuardService.this);
                      mainHandler.post(() -> overlayView.updateState(Collections.emptyList(), nudeNetDetector.statusMsg));
                  });

                  mainHandler.postDelayed(scanLoop, 500);
              }

              private boolean isHomeOrSafeApp() {
                  String p = activePkg.toLowerCase();
                  if (p.isEmpty()) return false;
                  return p.contains("launcher") || p.contains("sec.android.app.launcher")
                          || p.contains("quickstep") || p.contains("com.ghaad.shield")
                          || p.contains("inputmethod") || p.contains("honeyboard")
                          || p.contains("android.settings") || p.contains("dialer") || p.contains("bkash");
              }

              private final Runnable scanLoop = new Runnable() {
                  @Override
                  public void run() {
                      if (isHomeOrSafeApp()) {
                          activeTrackedBoxes.clear();
                          overlayView.updateState(Collections.emptyList(), "");
                          mainHandler.postDelayed(this, 450);
                          return;
                      }

                      if (nudeNetDetector == null || !nudeNetDetector.isReady()) {
                          String msg = nudeNetDetector != null ? nudeNetDetector.statusMsg : "LOADING ONNX...";
                          overlayView.updateState(Collections.emptyList(), msg);
                          mainHandler.postDelayed(this, 500);
                          return;
                      }

                      if (!isBusy && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          isBusy = true;
                          captureWithoutBlinking();
                      }
                      mainHandler.postDelayed(this, 1020);
                  }
              };

              private void captureWithoutBlinking() {
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, executor, new TakeScreenshotCallback() {
                          @Override
                          public void onSuccess(ScreenshotResult result) {
                              try {
                                  HardwareBuffer hb = result.getHardwareBuffer();
                                  ColorSpace cs = result.getColorSpace();
                                  Bitmap hwBmp = Bitmap.wrapHardwareBuffer(hb, cs);
                                  if (hwBmp != null) {
                                      int origW = hwBmp.getWidth();
                                      int origH = hwBmp.getHeight();
                                      Bitmap softBmp = hwBmp.copy(Bitmap.Config.ARGB_8888, false);
                                      hwBmp.recycle();
                                      hb.close();

                                      scanCounter++;
                                      processFrameZeroFlicker(softBmp, origW, origH);
                                  } else {
                                      hb.close();
                                      isBusy = false;
                                  }
                              } catch (Exception e) {
                                  mainHandler.post(() -> overlayView.updateState(null, "BMP ERR: " + e.getClass().getSimpleName()));
                                  isBusy = false;
                              }
                          }

                          @Override
                          public void onFailure(int errorCode) {
                              mainHandler.post(() -> overlayView.updateState(null, "SHOT WAIT (Code " + errorCode + ")"));
                              isBusy = false;
                          }
                      });
                  } catch (Exception e) {
                      isBusy = false;
                  }
              }

              private void processFrameZeroFlicker(Bitmap bmp, int screenW, int screenH) {
                  synchronized (activeTrackedBoxes) {
                      if (userJustScrolled) {
                          activeTrackedBoxes.clear();
                          userJustScrolled = false;
                      } else {
                          Iterator<TrackedBox> it = activeTrackedBoxes.iterator();
                          while (it.hasNext()) {
                              TrackedBox tb = it.next();
                              int[] currentBorder = sampleOuterBorder(bmp, tb.rect);
                              if (isBorderChangedSignificantly(tb.borderColors, currentBorder)) {
                                  it.remove();
                              }
                          }
                      }
                  }

                  List<Rect> newlyDetected = nudeNetDetector.detect(bmp, screenW, screenH);

                  synchronized (activeTrackedBoxes) {
                      List<Rect> allRects = new ArrayList<>();
                      for (TrackedBox tb : activeTrackedBoxes) {
                          allRects.add(new Rect(tb.rect));
                      }
                      allRects.addAll(newlyDetected);

                      List<Rect> merged = mergeBoxesCleanly(allRects, screenH);

                      activeTrackedBoxes.clear();
                      for (Rect mr : merged) {
                          TrackedBox tb = new TrackedBox();
                          tb.rect = mr;
                          tb.borderColors = sampleOuterBorder(bmp, mr);
                          activeTrackedBoxes.add(tb);
                      }

                      final List<Rect> finalBoxes = new ArrayList<>(merged);
                      final String hud = String.format(Locale.US, "Scan #%d | Cls:%d (%.0f%%) | Box:%d",
                              scanCounter, nudeNetDetector.lastBestClass, nudeNetDetector.lastMaxScore * 100f, finalBoxes.size());

                      mainHandler.post(() -> {
                          if (!isHomeOrSafeApp()) {
                              overlayView.updateState(finalBoxes, hud);
                          } else {
                              overlayView.updateState(Collections.emptyList(), "");
                          }
                      });
                  }

                  bmp.recycle();
                  isBusy = false;
              }

              private int[] sampleOuterBorder(Bitmap bmp, Rect r) {
                  int w = bmp.getWidth(), h = bmp.getHeight();
                  int left = Math.max(2, r.left - 8);
                  int top = Math.max(2, r.top - 8);
                  int right = Math.min(w - 3, r.right + 8);
                  int bottom = Math.min(h - 3, r.bottom + 8);

                  int[] samples = new int[12];
                  int idx = 0;
                  for (int i = 1; i <= 3; i++) {
                      samples[idx++] = bmp.getPixel(left + (right - left) * i / 4, top);
                      samples[idx++] = bmp.getPixel(left + (right - left) * i / 4, bottom);
                      samples[idx++] = bmp.getPixel(left, top + (bottom - top) * i / 4);
                      samples[idx++] = bmp.getPixel(right, top + (bottom - top) * i / 4);
                  }
                  return samples;
              }

              private boolean isBorderChangedSignificantly(int[] oldB, int[] newB) {
                  if (oldB == null || newB == null || oldB.length != newB.length) return true;
                  int changed = 0;
                  for (int i = 0; i < oldB.length; i++) {
                      int c1 = oldB[i], c2 = newB[i];
                      int diff = Math.abs(((c1 >> 16) & 0xFF) - ((c2 >> 16) & 0xFF))
                               + Math.abs(((c1 >> 8) & 0xFF) - ((c2 >> 8) & 0xFF))
                               + Math.abs((c1 & 0xFF) - (c2 & 0xFF));
                      if (diff > 65) changed++;
                  }
                  return changed >= 6;
              }

              private List<Rect> mergeBoxesCleanly(List<Rect> boxes, int screenH) {
                  if (boxes.size() <= 1) return boxes;
                  List<Rect> merged = new ArrayList<>(boxes);
                  boolean changed = true;
                  while (changed) {
                      changed = false;
                      for (int i = 0; i < merged.size(); i++) {
                          for (int j = i + 1; j < merged.size(); j++) {
                              Rect a = merged.get(i);
                              Rect b = merged.get(j);
                              Rect exp = new Rect(a.left - 35, a.top - 35, a.right + 35, a.bottom + 35);
                              if (Rect.intersects(exp, b)) {
                                  Rect u = new Rect(a);
                                  u.union(b);
                                  if (u.height() < (int) (screenH * 0.72f)) {
                                      merged.set(i, u);
                                      merged.remove(j);
                                      changed = true;
                                      break;
                                  }
                              }
                          }
                          if (changed) break;
                      }
                  }
                  return merged;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  if (event.getEventType() == AccessibilityEvent.TYPE_VIEW_SCROLLED) {
                      userJustScrolled = true;
                      activeTrackedBoxes.clear();
                      overlayView.updateState(Collections.emptyList(), "SCROLLED - RESCANNING...");
                  }

                  if (event.getPackageName() != null) {
                      String pkg = event.getPackageName().toString();
                      if (!pkg.contains("systemui")) {
                          activePkg = pkg;
                      }
                      if (isHomeOrSafeApp()) {
                          activeTrackedBoxes.clear();
                          overlayView.updateState(Collections.emptyList(), "");
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              @Override
              public void onInterrupt() {}
          }
