          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/CensorOverlayView.java
          package com.ghaad.shield;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.view.View;
          import java.util.ArrayList;
          import java.util.List;

          public class CensorOverlayView extends View {
              private final List<Rect> blockedRects = new ArrayList<>();
              private final Paint boxPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint borderPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);

              public CensorOverlayView(Context context) {
                  super(context);
                  boxPaint.setColor(Color.BLACK);
                  boxPaint.setAlpha(255);
                  boxPaint.setStyle(Paint.Style.FILL);

                  borderPaint.setColor(Color.rgb(220, 38, 38));
                  borderPaint.setStyle(Paint.Style.STROKE);
                  borderPaint.setStrokeWidth(3f);

                  textPaint.setColor(Color.WHITE);
                  textPaint.setTextSize(30f);
                  textPaint.setTextAlign(Paint.Align.CENTER);
                  textPaint.setFakeBoldText(true);
              }

              public synchronized void setBoxes(List<Rect> rects) {
                  blockedRects.clear();
                  if (rects != null) {
                      blockedRects.addAll(rects);
                  }
                  postInvalidate();
              }

              @Override
              protected synchronized void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  for (Rect r : blockedRects) {
                      RectF rf = new RectF(r);
                      canvas.drawRoundRect(rf, 14f, 14f, boxPaint);
                      canvas.drawRoundRect(rf, 14f, 14f, borderPaint);
                      canvas.drawText("GHAAD BLOCKED", r.centerX(), r.centerY(), textPaint);
                  }
              }
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/NudeNetOnnxDetector.java
          package com.ghaad.shield;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Rect;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.nio.FloatBuffer;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          import ai.onnxruntime.OnnxTensor;
          import ai.onnxruntime.OrtEnvironment;
          import ai.onnxruntime.OrtSession;

          public class NudeNetOnnxDetector {
              private OrtEnvironment env;
              private OrtSession session;
              private String inputName;
              private boolean isLoaded = false;

              // User requested classes: EXCLUDE 1, 8, 9, 10, 12, 16; KEEP ALL OTHERS ACTIVE:
              // 0: FEMALE_GENITALIA_COVERED
              // 2: BUTTOCKS_EXPOSED
              // 3: FEMALE_BREAST_EXPOSED
              // 4: FEMALE_GENITALIA_EXPOSED
              // 5: MALE_BREAST_EXPOSED
              // 6: ANUS_EXPOSED
              // 7: FEET_EXPOSED
              // 11: ARMPITS_EXPOSED
              // 13: BELLY_EXPOSED
              // 14: MALE_GENITALIA_EXPOSED
              // 15: ANUS_COVERED
              // 17: BUTTOCKS_COVERED
              private static final int[] ACTIVE_CLASSES = {
                  0, 2, 3, 4, 5, 6, 7, 11, 13, 14, 15, 17
              };

              public NudeNetOnnxDetector(Context context) {
                  try {
                      env = OrtEnvironment.getEnvironment();
                      InputStream is = context.getAssets().open("nudenet.onnx");
                      ByteArrayOutputStream buffer = new ByteArrayOutputStream();
                      int nRead;
                      byte[] data = new byte[16384];
                      while ((nRead = is.read(data, 0, data.length)) != -1) {
                          buffer.write(data, 0, nRead);
                      }
                      is.close();
                      byte[] modelBytes = buffer.toByteArray();
                      if (modelBytes.length > 1000000) {
                          OrtSession.SessionOptions opts = new OrtSession.SessionOptions();
                          opts.setIntraOpNumThreads(2);
                          session = env.createSession(modelBytes, opts);
                          inputName = session.getInputNames().iterator().next();
                          isLoaded = true;
                      }
                  } catch (Exception ignored) {
                      isLoaded = false;
                  }
              }

              public boolean isReady() {
                  return isLoaded && session != null;
              }

              public List<Rect> detectSelectedClasses(Bitmap frameBmp, int screenW, int screenH) {
                  if (!isReady()) return Collections.emptyList();
                  List<Rect> results = new ArrayList<>();
                  try {
                      Bitmap resized = Bitmap.createScaledBitmap(frameBmp, 320, 320, false);
                      int[] pixels = new int[320 * 320];
                      resized.getPixels(pixels, 0, 320, 0, 0, 320, 320);
                      resized.recycle();

                      FloatBuffer floatBuffer = FloatBuffer.allocate(3 * 320 * 320);
                      int area = 320 * 320;
                      for (int i = 0; i < area; i++) {
                          int px = pixels[i];
                          floatBuffer.put(i, ((px >> 16) & 0xFF) / 255.0f);
                          floatBuffer.put(area + i, ((px >> 8) & 0xFF) / 255.0f);
                          floatBuffer.put(2 * area + i, (px & 0xFF) / 255.0f);
                      }
                      floatBuffer.rewind();

                      long[] shape = new long[]{1, 3, 320, 320};
                      OnnxTensor tensor = OnnxTensor.createTensor(env, floatBuffer, shape);
                      OrtSession.Result ortResult = session.run(Collections.singletonMap(inputName, tensor));
                      float[][][] output = (float[][][]) ortResult.get(0).getValue();
                      tensor.close();
                      ortResult.close();

                      int numProposals = output[0][0].length;
                      float scaleX = (float) screenW / 320.0f;
                      float scaleY = (float) screenH / 320.0f;

                      for (int i = 0; i < numProposals; i++) {
                          float maxScore = 0f;
                          int bestClass = -1;

                          for (int c : ACTIVE_CLASSES) {
                              float score = output[0][4 + c][i];
                              if (score > maxScore) {
                                  maxScore = score;
                                  bestClass = c;
                              }
                          }

                          // If it is only MALE_BREAST_EXPOSED (5) but a strong MALE_FACE (12) is present, require higher threshold so normal men aren't unnecessarily blocked
                          if (bestClass == 5 && maxScore < 0.45f) {
                              continue;
                          }

                          if (maxScore >= 0.28f) {
                              float cx = output[0][0][i];
                              float cy = output[0][1][i];
                              float w = output[0][2][i];
                              float h = output[0][3][i];

                              int bw = (int) (w * scaleX);
                              int bh = (int) (h * scaleY);
                              int padX = (int) (bw * 0.35f);
                              int padY = (int) (bh * 0.35f);

                              int left = Math.max(0, (int) ((cx - w / 2f) * scaleX) - padX);
                              int top = Math.max(0, (int) ((cy - h / 2f) * scaleY) - padY);
                              int right = Math.min(screenW, (int) ((cx + w / 2f) * scaleX) + padX);
                              int bottom = Math.min(screenH, (int) ((cy + h / 2f) * scaleY) + padY);

                              results.add(new Rect(left, top, right, bottom));
                          }
                      }
                  } catch (Exception ignored) {}
                  return results;
              }
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/GhaadGuardService.java
          package com.ghaad.shield;

          import android.accessibilityservice.AccessibilityService;
          import android.graphics.Bitmap;
          import android.graphics.ColorSpace;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.hardware.HardwareBuffer;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Iterator;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class GhaadGuardService extends AccessibilityService {
              public static GhaadGuardService instance;
              public static volatile String activePkg = "";
              public static volatile long pauseLockUntil = 0;

              private WindowManager windowManager;
              private CensorOverlayView overlayView;
              private NudeNetOnnxDetector nudeNetDetector;
              private Handler mainHandler;
              private ExecutorService executor;
              private volatile boolean isBusy = false;

              // ZERO-FLICKER TRACKER: Never hides the black box to take a screenshot!
              // Keeps existing box 100% solid until the user scrolls or the surrounding video scene changes!
              private static class TrackedBox {
                  Rect rect;
                  int[] borderColors;
              }
              private final List<TrackedBox> activeTrackedBoxes = new ArrayList<>();
              private volatile boolean userJustScrolled = false;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  mainHandler = new Handler(Looper.getMainLooper());
                  executor = Executors.newSingleThreadExecutor();

                  try {
                      windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                      overlayView = new CensorOverlayView(this);
                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT
                      );
                      params.gravity = Gravity.TOP | Gravity.START;
                      windowManager.addView(overlayView, params);
                  } catch (Exception ignored) {}

                  executor.execute(() -> {
                      nudeNetDetector = new NudeNetOnnxDetector(GhaadGuardService.this);
                  });

                  mainHandler.postDelayed(scanLoop, 450);
              }

              private boolean isHomeOrSafeApp() {
                  String p = activePkg.toLowerCase();
                  if (p.isEmpty()) return true;
                  return p.contains("launcher") || p.contains("sec.android.app.launcher")
                          || p.contains("quickstep") || p.contains("com.ghaad.shield")
                          || p.contains("inputmethod") || p.contains("honeyboard")
                          || p.contains("systemui") || p.contains("android.settings")
                          || p.contains("dialer") || p.contains("bkash") || p.contains("nagad");
              }

              private final Runnable scanLoop = new Runnable() {
                  @Override
                  public void run() {
                      if (isHomeOrSafeApp()) {
                          activeTrackedBoxes.clear();
                          overlayView.setBoxes(Collections.emptyList());
                          mainHandler.postDelayed(this, 450);
                          return;
                      }

                      if (!isBusy && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R
                              && nudeNetDetector != null && nudeNetDetector.isReady()) {
                          isBusy = true;
                          captureWithoutBlinking();
                      }
                      mainHandler.postDelayed(this, 1020);
                  }
              };

              private void captureWithoutBlinking() {
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, executor, new TakeScreenshotCallback() {
                          @Override
                          public void onSuccess(ScreenshotResult result) {
                              try {
                                  HardwareBuffer hb = result.getHardwareBuffer();
                                  ColorSpace cs = result.getColorSpace();
                                  Bitmap hwBmp = Bitmap.wrapHardwareBuffer(hb, cs);
                                  if (hwBmp != null) {
                                      int origW = hwBmp.getWidth();
                                      int origH = hwBmp.getHeight();
                                      Bitmap softBmp = hwBmp.copy(Bitmap.Config.ARGB_8888, false);
                                      hwBmp.recycle();
                                      hb.close();

                                      processFrameZeroFlicker(softBmp, origW, origH);
                                  } else {
                                      hb.close();
                                      isBusy = false;
                                  }
                              } catch (Exception e) {
                                  isBusy = false;
                              }
                          }

                          @Override
                          public void onFailure(int errorCode) {
                              isBusy = false;
                          }
                      });
                  } catch (Exception e) {
                      isBusy = false;
                  }
              }

              private void processFrameZeroFlicker(Bitmap bmp, int screenW, int screenH) {
                  // 1. Check if existing boxes are still on the same video scene or if the scene/scroll changed
                  synchronized (activeTrackedBoxes) {
                      if (userJustScrolled) {
                          activeTrackedBoxes.clear();
                          userJustScrolled = false;
                      } else {
                          Iterator<TrackedBox> it = activeTrackedBoxes.iterator();
                          while (it.hasNext()) {
                              TrackedBox tb = it.next();
                              int[] currentBorder = sampleOuterBorder(bmp, tb.rect);
                              if (isBorderChangedSignificantly(tb.borderColors, currentBorder)) {
                                  it.remove(); // Video scene changed! Remove old box cleanly.
                              }
                          }
                      }
                  }

                  // 2. Run NudeNet ONNX on current screen for new exposed body regions
                  List<Rect> newlyDetected = nudeNetDetector.detectSelectedClasses(bmp, screenW, screenH);

                  synchronized (activeTrackedBoxes) {
                      List<Rect> allRects = new ArrayList<>();
                      for (TrackedBox tb : activeTrackedBoxes) {
                          allRects.add(new Rect(tb.rect));
                      }
                      allRects.addAll(newlyDetected);

                      List<Rect> merged = mergeBoxesCleanly(allRects, screenH);

                      activeTrackedBoxes.clear();
                      for (Rect mr : merged) {
                          TrackedBox tb = new TrackedBox();
                          tb.rect = mr;
                          tb.borderColors = sampleOuterBorder(bmp, mr);
                          activeTrackedBoxes.add(tb);
                      }

                      final List<Rect> finalBoxes = new ArrayList<>(merged);
                      mainHandler.post(() -> {
                          if (!isHomeOrSafeApp()) {
                              overlayView.setBoxes(finalBoxes);
                          } else {
                              overlayView.setBoxes(Collections.emptyList());
                          }
                      });
                  }

                  bmp.recycle();
                  isBusy = false;
              }

              private int[] sampleOuterBorder(Bitmap bmp, Rect r) {
                  int w = bmp.getWidth(), h = bmp.getHeight();
                  int left = Math.max(2, r.left - 10);
                  int top = Math.max(2, r.top - 10);
                  int right = Math.min(w - 3, r.right + 10);
                  int bottom = Math.min(h - 3, r.bottom + 10);

                  int[] samples = new int[12];
                  int idx = 0;
                  for (int i = 1; i <= 3; i++) {
                      samples[idx++] = bmp.getPixel(left + (right - left) * i / 4, top);
                      samples[idx++] = bmp.getPixel(left + (right - left) * i / 4, bottom);
                      samples[idx++] = bmp.getPixel(left, top + (bottom - top) * i / 4);
                      samples[idx++] = bmp.getPixel(right, top + (bottom - top) * i / 4);
                  }
                  return samples;
              }

              private boolean isBorderChangedSignificantly(int[] oldB, int[] newB) {
                  if (oldB == null || newB == null || oldB.length != newB.length) return true;
                  int changed = 0;
                  for (int i = 0; i < oldB.length; i++) {
                      int c1 = oldB[i], c2 = newB[i];
                      int diff = Math.abs(((c1 >> 16) & 0xFF) - ((c2 >> 16) & 0xFF))
                               + Math.abs(((c1 >> 8) & 0xFF) - ((c2 >> 8) & 0xFF))
                               + Math.abs((c1 & 0xFF) - (c2 & 0xFF));
                      if (diff > 65) changed++;
                  }
                  return changed >= 6;
              }

              private List<Rect> mergeBoxesCleanly(List<Rect> boxes, int screenH) {
                  if (boxes.size() <= 1) return boxes;
                  List<Rect> merged = new ArrayList<>(boxes);
                  boolean changed = true;
                  while (changed) {
                      changed = false;
                      for (int i = 0; i < merged.size(); i++) {
                          for (int j = i + 1; j < merged.size(); j++) {
                              Rect a = merged.get(i);
                              Rect b = merged.get(j);
                              Rect exp = new Rect(a.left - 35, a.top - 35, a.right + 35, a.bottom + 35);
                              if (Rect.intersects(exp, b)) {
                                  Rect u = new Rect(a);
                                  u.union(b);
                                  if (u.height() < (int) (screenH * 0.72f)) {
                                      merged.set(i, u);
                                      merged.remove(j);
                                      changed = true;
                                      break;
                                  }
                              }
                          }
                          if (changed) break;
                      }
                  }
                  return merged;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  if (event.getEventType() == AccessibilityEvent.TYPE_VIEW_SCROLLED) {
                      userJustScrolled = true;
                      activeTrackedBoxes.clear();
                      overlayView.setBoxes(Collections.emptyList());
                  }

                  if (event.getPackageName() != null) {
                      String pkg = event.getPackageName().toString();
                      if (!pkg.contains("systemui")) {
                          activePkg = pkg;
                      }
                      if (isHomeOrSafeApp()) {
                          activeTrackedBoxes.clear();
                          overlayView.setBoxes(Collections.emptyList());
                      }
                  }

                  if (System.currentTimeMillis() < pauseLockUntil) return;

                  // V10.2 Style Anti-Uninstall Guard: ONLY inside Android Settings / PackageInstaller
                  // Never triggers inside App Drawer, Browser, or Chat!
                  String pkg = activePkg.toLowerCase();
                  if (pkg.equals("com.android.settings") || pkg.contains("packageinstaller")) {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root != null) {
                          String text = collectText(root).toLowerCase();
                          root.recycle();
                          if (text.contains("ghaad v14 shield")) {
                              if (text.contains("uninstall") || text.contains("force stop")
                                      || text.contains("deactivate") || text.contains("app info")) {
                                  performGlobalAction(GLOBAL_ACTION_BACK);
                                  performGlobalAction(GLOBAL_ACTION_HOME);
                              }
                          }
                      }
                  }
              }

              private String collectText(AccessibilityNodeInfo node) {
                  if (node == null) return "";
                  StringBuilder sb = new StringBuilder();
                  if (node.getText() != null) sb.append(node.getText()).append(" ");
                  if (node.getContentDescription() != null) sb.append(node.getContentDescription()).append(" ");
                  int count = node.getChildCount();
                  for (int i = 0; i < count; i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) {
                          sb.append(collectText(child));
                          child.recycle();
                      }
                  }
                  return sb.toString();
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              @Override
              public void onInterrupt() {}
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/MainActivity.java
          package com.ghaad.shield;

          import android.app.Activity;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private Button btnAdmin, btnGuard;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setBackgroundColor(Color.parseColor("#0b0f19"));
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(60, 60, 60, 60);

                  TextView title = new TextView(this);
                  title.setText("GHAAD SHIELD V14.0\nZero-Flicker NudeNet Body AI");
                  title.setTextColor(Color.parseColor("#10b981"));
                  title.setTextSize(22);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 25);

                  // Secret Owner Unlock (Just like V10): Hold title for 3s to unlock for 60s
                  title.setOnLongClickListener(v -> {
                      GhaadGuardService.pauseLockUntil = System.currentTimeMillis() + 60000;
                      DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                      ComponentName comp = new ComponentName(this, GhaadAdminReceiver.class);
                      if (dpm != null && dpm.isAdminActive(comp)) {
                          dpm.removeActiveAdmin(comp);
                      }
                      Toast.makeText(this, "Owner Unlock Active for 60 seconds!", Toast.LENGTH_LONG).show();
                      updateStatus();
                      return true;
                  });
                  layout.addView(title);

                  TextView sub = new TextView(this);
                  sub.setText("• Blocks Classes: 0, 2, 3, 4, 5, 6, 7, 11, 13, 14, 15, 17\n• Ignores Faces & Covered Clothing (1, 8, 9, 10, 12, 16)\n• Zero Flickering & Safe for All Apps");
                  sub.setTextColor(Color.parseColor("#cbd5e1"));
                  sub.setTextSize(14);
                  sub.setGravity(Gravity.CENTER);
                  sub.setPadding(0, 0, 0, 50);
                  layout.addView(sub);

                  btnAdmin = new Button(this);
                  btnAdmin.setOnClickListener(v -> {
                      ComponentName comp = new ComponentName(this, GhaadAdminReceiver.class);
                      Intent intent = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                      intent.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, comp);
                      startActivity(intent);
                  });
                  layout.addView(btnAdmin);

                  TextView space = new TextView(this);
                  space.setHeight(35);
                  layout.addView(space);

                  btnGuard = new Button(this);
                  btnGuard.setOnClickListener(v -> {
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                  });
                  layout.addView(btnGuard);

                  setContentView(layout);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateStatus();
              }

              private void updateStatus() {
                  DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                  ComponentName comp = new ComponentName(this, GhaadAdminReceiver.class);
                  boolean s1 = dpm != null && dpm.isAdminActive(comp);
                  btnAdmin.setText((s1 ? "✅ " : "❌ ") + "Step 1: Lock Uninstall (Device Admin)");

                  boolean s2 = GhaadGuardService.instance != null;
                  btnGuard.setText((s2 ? "✅ " : "❌ ") + "Step 2: Activate V14 Body AI Shield");
              }
          }
          EOF

      - name: Build APK with Gradle
        working-directory: android_build
        run: gradle assembleDebug

      - name: Prepare APK File
        run: cp android_build/app/build/outputs/apk/debug/app-debug.apk Ghaad_V14_Final.apk

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghaad_V14_Final_APK
          path: Ghaad_V14_Final.apk
