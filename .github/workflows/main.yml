          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.mlkit:face-detection:16.1.6'
              implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
