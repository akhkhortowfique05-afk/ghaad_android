          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/DedicatedGenderAndBodyAI.java
          package com.ghaad.shield;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Rect;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.nio.FloatBuffer;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          import ai.onnxruntime.OnnxTensor;
          import ai.onnxruntime.OrtEnvironment;
          import ai.onnxruntime.OrtSession;

          public class DedicatedGenderAndBodyAI {
              private OrtEnvironment env;
              private OrtSession genderSession;
              private String genderInputName;
              private OrtSession nudeNetSession;
              private String nudeNetInputName;
              private boolean ready = false;

              private static final int[] BODY_CLASSES = {0, 2, 3, 4, 6, 8, 11, 13, 14, 15, 16, 17};

              public static class NudeNetScanResult {
                  public List<Rect> bodyAndFemaleBoxes = new ArrayList<>();
                  public List<Rect> maleFaceBoxes = new ArrayList<>();
              }

              public DedicatedGenderAndBodyAI(Context context) {
                  try {
                      env = OrtEnvironment.getEnvironment();
                      File gFile = copyAsset(context, "gender_cls.onnx", "v26_1_gender_cls.onnx");
                      File nFile = copyAsset(context, "nudenet.onnx", "v26_1_nudenet.onnx");

                      OrtSession.SessionOptions opts = new OrtSession.SessionOptions();
                      opts.setIntraOpNumThreads(2);
                      genderSession = env.createSession(gFile.getAbsolutePath(), opts);
                      genderInputName = genderSession.getInputNames().iterator().next();

                      nudeNetSession = env.createSession(nFile.getAbsolutePath(), opts);
                      nudeNetInputName = nudeNetSession.getInputNames().iterator().next();
                      ready = true;
                  } catch (Exception ignored) {
                      ready = false;
                  }
              }

              private File copyAsset(Context ctx, String assetName, String outName) throws Exception {
                  File outFile = new File(ctx.getFilesDir(), outName);
                  if (!outFile.exists() || outFile.length() < 100000) {
                      InputStream is = ctx.getAssets().open(assetName);
                      FileOutputStream fos = new FileOutputStream(outFile);
                      byte[] buf = new byte[32768];
                      int len;
                      while ((len = is.read(buf)) != -1) {
                          fos.write(buf, 0, len);
                      }
                      fos.flush();
                      fos.close();
                      is.close();
                  }
                  return outFile;
              }

              public boolean isReady() {
                  return ready;
              }

              public float getFemaleProbability(Bitmap bmp, Rect faceBox) {
                  if (!ready || genderSession == null) return 0f;
                  try {
                      int w = bmp.getWidth(), h = bmp.getHeight();
                      int fw = faceBox.width(), fh = faceBox.height();
                      int padX = fw / 3, padY = fh / 3;
                      int x1 = Math.max(0, faceBox.left - padX);
                      int y1 = Math.max(0, faceBox.top - padY);
                      int x2 = Math.min(w, faceBox.right + padX);
                      int y2 = Math.min(h, faceBox.bottom + padY);
                      if (x2 - x1 < 12 || y2 - y1 < 12) return 0f;

                      Bitmap crop = Bitmap.createBitmap(bmp, x1, y1, x2 - x1, y2 - y1);
                      Bitmap resized = Bitmap.createScaledBitmap(crop, 128, 128, true);
                      crop.recycle();

                      int[] pixels = new int[128 * 128];
                      resized.getPixels(pixels, 0, 128, 0, 0, 128, 128);
                      resized.recycle();

                      FloatBuffer fb = FloatBuffer.allocate(3 * 128 * 128);
                      int area = 128 * 128;
                      for (int i = 0; i < area; i++) {
                          int px = pixels[i];
                          fb.put(i, ((px >> 16) & 0xFF) / 255.0f);
                          fb.put(area + i, ((px >> 8) & 0xFF) / 255.0f);
                          fb.put(2 * area + i, (px & 0xFF) / 255.0f);
                      }
                      fb.rewind();

                      OnnxTensor tensor = OnnxTensor.createTensor(env, fb, new long[]{1, 3, 128, 128});
                      OrtSession.Result res = genderSession.run(Collections.singletonMap(genderInputName, tensor));
                      float[][] probs = (float[][]) res.get(0).getValue();
                      tensor.close();
                      res.close();

                      return probs[0][0];
                  } catch (Exception e) {
                      return 0f;
                  }
              }

              public Rect findActiveVideoBounds(Bitmap bmp) {
                  int w = bmp.getWidth();
                  int h = bmp.getHeight();
                  int topBar = 0, botBar = h;
                  for (int y = h / 12; y < h * 4 / 10; y += 6) {
                      int bright = 0;
                      for (int x = w / 6; x < w * 5 / 6; x += 12) {
                          int px = bmp.getPixel(x, y);
                          if (((px >> 16) & 0xFF) > 20 || ((px >> 8) & 0xFF) > 20 || (px & 0xFF) > 20) bright++;
                      }
                      if (bright >= 3) { topBar = Math.max(0, y - 8); break; }
                  }
                  for (int y = h * 11 / 12; y > h * 6 / 10; y -= 6) {
                      int bright = 0;
                      for (int x = w / 6; x < w * 5 / 6; x += 12) {
                          int px = bmp.getPixel(x, y);
                          if (((px >> 16) & 0xFF) > 20 || ((px >> 8) & 0xFF) > 20 || (px & 0xFF) > 20) bright++;
                      }
                      if (bright >= 3) { botBar = Math.min(h, y + 8); break; }
                  }
                  if (botBar - topBar < h / 5) return new Rect(0, 0, w, h);
                  return new Rect(0, topBar, w, botBar);
              }

              public NudeNetScanResult scanScreenMultiTile(Bitmap fullBmp, Rect activeBounds, int screenW, int screenH) {
                  NudeNetScanResult totalRes = new NudeNetScanResult();
                  if (!ready || nudeNetSession == null) return totalRes;

                  float scaleFullX = (float) screenW / fullBmp.getWidth();
                  float scaleFullY = (float) screenH / fullBmp.getHeight();

                  Bitmap activeBmp = Bitmap.createBitmap(
                          fullBmp, activeBounds.left, activeBounds.top,
                          activeBounds.width(), activeBounds.height()
                  );
                  int aw = activeBmp.getWidth();
                  int ah = activeBmp.getHeight();
                  int offX = Math.round(activeBounds.left * scaleFullX);
                  int offY = Math.round(activeBounds.top * scaleFullY);
                  int activeScreenW = Math.round(aw * scaleFullX);
                  int activeScreenH = Math.round(ah * scaleFullY);

                  if (ah > aw * 1.3f) {
                      int tileH = (int) (ah * 0.58f);
                      int tileScreenH = (int) (activeScreenH * 0.58f);

                      Bitmap topTile = Bitmap.createBitmap(activeBmp, 0, 0, aw, tileH);
                      runNudeNetOnTile(topTile, offX, offY, activeScreenW, tileScreenH, screenW, screenH, totalRes);
                      topTile.recycle();

                      Bitmap botTile = Bitmap.createBitmap(activeBmp, 0, ah - tileH, aw, tileH);
                      runNudeNetOnTile(botTile, offX, offY + (activeScreenH - tileScreenH), activeScreenW, tileScreenH, screenW, screenH, totalRes);
                      botTile.recycle();
                  } else if (aw > ah * 1.35f) {
                      int tileW = (int) (aw * 0.60f);
                      int tileScreenW = (int) (activeScreenW * 0.60f);

                      Bitmap leftTile = Bitmap.createBitmap(activeBmp, 0, 0, tileW, ah);
                      runNudeNetOnTile(leftTile, offX, offY, tileScreenW, activeScreenH, screenW, screenH, totalRes);
                      leftTile.recycle();

                      Bitmap rightTile = Bitmap.createBitmap(activeBmp, aw - tileW, 0, tileW, ah);
                      runNudeNetOnTile(rightTile, offX + (activeScreenW - tileScreenW), offY, tileScreenW, activeScreenH, screenW, screenH, totalRes);
                      rightTile.recycle();
                  } else {
                      runNudeNetOnTile(activeBmp, offX, offY, activeScreenW, activeScreenH, screenW, screenH, totalRes);
                  }
                  activeBmp.recycle();
                  return totalRes;
              }

              private void runNudeNetOnTile(Bitmap tileBmp, int offX, int offY, int tileScreenW, int tileScreenH,
                                            int fullScreenW, int fullScreenH, NudeNetScanResult outRes) {
                  try {
                      int tw = tileBmp.getWidth();
                      int th = tileBmp.getHeight();
                      float r = Math.min(320.0f / tw, 320.0f / th);
                      int unpadW = Math.round(tw * r);
                      int unpadH = Math.round(th * r);

                      Bitmap resized = Bitmap.createScaledBitmap(tileBmp, unpadW, unpadH, true);
                      Bitmap letterboxed = Bitmap.createBitmap(320, 320, Bitmap.Config.ARGB_8888);
                      Canvas c = new Canvas(letterboxed);
                      c.drawColor(Color.rgb(114, 114, 114));
                      c.drawBitmap(resized, 0, 0, null);
                      resized.recycle();

                      int[] pixels = new int[320 * 320];
                      letterboxed.getPixels(pixels, 0, 320, 0, 0, 320, 320);
                      letterboxed.recycle();

                      FloatBuffer fb = FloatBuffer.allocate(3 * 320 * 320);
                      int area = 320 * 320;
                      for (int i = 0; i < area; i++) {
                          int px = pixels[i];
                          fb.put(i, ((px >> 16) & 0xFF) / 255.0f);
                          fb.put(area + i, ((px >> 8) & 0xFF) / 255.0f);
                          fb.put(2 * area + i, (px & 0xFF) / 255.0f);
                      }
                      fb.rewind();

                      OnnxTensor tensor = OnnxTensor.createTensor(env, fb, new long[]{1, 3, 320, 320});
                      OrtSession.Result res = nudeNetSession.run(Collections.singletonMap(nudeNetInputName, tensor));
                      Object rawOut = res.get(0).getValue();

                      float[][] preds;
                      if (rawOut instanceof float[][][]) {
                          float[][][] out3d = (float[][][]) rawOut;
                          if (out3d[0].length == 22) {
                              int anchors = out3d[0][0].length;
                              preds = new float[anchors][22];
                              for (int a = 0; a < anchors; a++) {
                                  for (int col = 0; col < 22; col++) {
                                      preds[a][col] = out3d[0][col][a];
                                  }
                              }
                          } else {
                              preds = out3d[0];
                          }
                      } else {
                          tensor.close();
                          res.close();
                          return;
                      }
                      tensor.close();
                      res.close();

                      float scaleX = (float) tileScreenW / unpadW;
                      float scaleY = (float) tileScreenH / unpadH;

                      for (int i = 0; i < preds.length; i++) {
                          float[] row = preds[i];
                          float maleFaceScore = row[4 + 12];
                          float femFaceScore = row[4 + 1];

                          if (maleFaceScore >= 0.24f && maleFaceScore > femFaceScore) {
                              Rect mr = toScreenRect(row, scaleX, scaleY, offX, offY, fullScreenW, fullScreenH, 0.4f, 0.4f);
                              if (mr != null) outRes.maleFaceBoxes.add(mr);
                          }

                          if (femFaceScore >= 0.22f && femFaceScore > maleFaceScore) {
                              Rect fr = toScreenRect(row, scaleX, scaleY, offX, offY, fullScreenW, fullScreenH, 0.85f, 2.2f);
                              if (fr != null) outRes.bodyAndFemaleBoxes.add(fr);
                          }

                          float bestBody = 0f;
                          for (int cls : BODY_CLASSES) {
                              if (row[4 + cls] > bestBody) {
                                  bestBody = row[4 + cls];
                              }
                          }
                          if (bestBody >= 0.14f) {
                              Rect br = toScreenRect(row, scaleX, scaleY, offX, offY, fullScreenW, fullScreenH, 0.70f, 0.90f);
                              if (br != null) outRes.bodyAndFemaleBoxes.add(br);
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private Rect toScreenRect(float[] row, float scaleX, float scaleY, int offX, int offY,
                                        int fullW, int fullH, float padX, float padY) {
                  float cx = row[0], cy = row[1], w = row[2], h = row[3];
                  if (cx <= 1.05f && cy <= 1.05f && w <= 1.05f && h <= 1.05f) {
                      cx *= 320f; cy *= 320f; w *= 320f; h *= 320f;
                  }
                  int bw = Math.round(w * scaleX);
                  int bh = Math.round(h * scaleY);
                  if (bw < 12 || bh < 12) return null;
                  int px = Math.round(bw * padX);
                  int py = Math.round(bh * padY);
                  int l = Math.max(0, offX + Math.round((cx - w / 2f) * scaleX) - px);
                  int t = Math.max(0, offY + Math.round((cy - h / 2f) * scaleY) - py);
                  int r = Math.min(fullW, offX + Math.round((cx + w / 2f) * scaleX) + px);
                  int b = Math.min(fullH, offY + Math.round((cy + h / 2f) * scaleY) + py);
                  return new Rect(l, t, r, b);
              }
          }
          EOF

