                  int l = Math.max(0, fb.left), r = Math.min(w - 1, fb.right);
                  int t = Math.max(0, fb.top), b = Math.min(h - 1, fb.bottom);
                  int fw = fb.width(), fh = fb.height();
                  if (fw < 10 || fh < 10) return false;

                  // Cue A: If chest/belly below chin has high bare skin (like 00:18 red outfit actress), NEVER treat as clothed male!
                  int chestTop = Math.min(h - 1, b + fh / 3);
                  int chestBot = Math.min(h - 1, b + (int) (fh * 2.2f));
                  int chestLeft = Math.max(0, l - fw / 2);
                  int chestRight = Math.min(w - 1, r + fw / 2);
                  int chestSkin = 0, chestTotal = 0;
                  for (int y = chestTop; y <= chestBot; y += 2) {
                      for (int x = chestLeft; x <= chestRight; x += 2) {
                          chestTotal++;
                          if (isSkin(bmp.getPixel(x, y))) chestSkin++;
                      }
                  }
                  if (chestTotal > 0 && (chestSkin * 100 / chestTotal) >= 22) {
                      return false; // Exposed chest/midriff -> Woman!
                  }

                  // Cue B: Compare Forehead/Cheek brightness vs Upper-Lip/Chin (Beard/Mustache detector!)
                  int foreheadY1 = t + fh / 8;
                  int foreheadY2 = t + fh * 3 / 8;
                  int chinY1 = t + fh * 5 / 8;
                  int chinY2 = b;
                  int midX1 = l + fw / 4;
                  int midX2 = r - fw / 4;

                  long upperBrightness = 0, upperCount = 0;
                  for (int y = foreheadY1; y <= foreheadY2; y += 2) {
                      for (int x = midX1; x <= midX2; x += 2) {
                          upperBrightness += getLuminance(bmp.getPixel(x, y));
                          upperCount++;
                      }
                  }

                  long lowerBrightness = 0, lowerCount = 0;
                  int darkBeardPixels = 0;
                  for (int y = chinY1; y <= chinY2; y += 2) {
                      for (int x = midX1; x <= midX2; x += 2) {
                          int px = bmp.getPixel(x, y);
                          int lum = getLuminance(px);
                          lowerBrightness += lum;
                          lowerCount++;
                          if (lum < 75 && !isSkin(px)) {
                              darkBeardPixels++;
                          }
                      }
