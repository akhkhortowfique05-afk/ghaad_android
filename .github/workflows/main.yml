              private boolean areTwoFacesClose(List<Face> faces) {
                  if (faces.size() < 2) return false;
                  for (int i = 0; i < faces.size(); i++) {
                      for (int j = i + 1; j < faces.size(); j++) {
                          Rect a = faces.get(i).getBoundingBox();
                          Rect b = faces.get(j).getBoundingBox();
                          Rect exp = new Rect(a.left - a.width(), a.top - a.height() / 2, a.right + a.width(), a.bottom + a.height());
                          if (Rect.intersects(exp, b)) return true;
                      }
                  }
                  return false;
              }

              private int getChestSkinPercentage(Bitmap bmp, Rect fb) {
                  int w = bmp.getWidth(), h = bmp.getHeight();
                  int fw = fb.width(), fh = fb.height();
                  int top = Math.min(h - 1, fb.bottom + fh / 5);
                  int bot = Math.min(h - 1, fb.bottom + (int) (fh * 2.0f));
                  int left = Math.max(0, fb.left - fw / 2);
                  int right = Math.min(w - 1, fb.right + fw / 2);

                  int skin = 0, total = 0;
                  for (int y = top; y <= bot; y += 2) {
                      for (int x = left; x <= right; x += 2) {
                          total++;
                          int px = bmp.getPixel(x, y);
                          int R = (px >> 16) & 0xFF, G = (px >> 8) & 0xFF, B = px & 0xFF;
                          if (R > 75 && G > 32 && B > 18 && R > G && G >= B && (R - G) >= 12) {
                              int Cr = 128 + ((112 * R - 93 * G - 18 * B) >> 8);
                              int Cb = 128 + ((-37 * R - 74 * G + 112 * B) >> 8);
                              if (Cr >= 133 && Cr <= 174 && Cb >= 79 && Cb <= 126) skin++;
                          }
                      }
                  }
                  return total > 0 ? (skin * 100 / total) : 0;
              }

              private int[] sampleOuterBorder(Bitmap bmp, Rect screenRect, float scaleX, float scaleY) {
                  int w = bmp.getWidth(), h = bmp.getHeight();
                  int l = Math.max(2, (int) (screenRect.left / scaleX) - 8);
                  int t = Math.max(2, (int) (screenRect.top / scaleY) - 8);
                  int r = Math.min(w - 3, (int) (screenRect.right / scaleX) + 8);
                  int b = Math.min(h - 3, (int) (screenRect.bottom / scaleY) + 8);

                  int[] sig = new int[12];
                  int idx = 0;
                  for (int i = 1; i <= 3; i++) {
                      sig[idx++] = bmp.getPixel(l + (r - l) * i / 4, t);
                      sig[idx++] = bmp.getPixel(l + (r - l) * i / 4, b);
                      sig[idx++] = bmp.getPixel(l, t + (b - t) * i / 4);
                      sig[idx++] = bmp.getPixel(r, t + (b - t) * i / 4);
                  }
                  return sig;
              }

              private boolean isSceneChangedOutsideBox(int[] oldSig, int[] newSig) {
                  if (oldSig == null || newSig == null || oldSig.length != newSig.length) return true;
                  int diffCount = 0;
                  for (int i = 0; i < oldSig.length; i++) {
                      int c1 = oldSig[i], c2 = newSig[i];
                      int diff = Math.abs(((c1 >> 16) & 0xFF) - ((c2 >> 16) & 0xFF))
                               + Math.abs(((c1 >> 8) & 0xFF) - ((c2 >> 8) & 0xFF))
                               + Math.abs((c1 & 0xFF) - (c2 & 0xFF));
                      if (diff > 65) diffCount++;
                  }
                  return diffCount >= 6;
              }

              private List<Rect> mergeBoxesCleanly(List<Rect> boxes, int screenH) {
                  if (boxes.size() <= 1) return boxes;
                  List<Rect> merged = new ArrayList<>(boxes);
                  boolean changed = true;
                  while (changed) {
                      changed = false;
                      for (int i = 0; i < merged.size(); i++) {
                          for (int j = i + 1; j < merged.size(); j++) {
                              Rect a = merged.get(i);
                              Rect b = merged.get(j);
                              if (Rect.intersects(a, b)) {
                                  Rect u = new Rect(a);
                                  u.union(b);
                                  if (u.height() < (int) (screenH * 0.68f)) {
                                      merged.set(i, u);
                                      merged.remove(j);
                                      changed = true;
                                      break;
                                  }
                              }
                          }
                          if (changed) break;
                      }
                  }
                  return merged;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  if (event.getEventType() == AccessibilityEvent.TYPE_VIEW_SCROLLED) {
                      userScrolled = true;
                  }
                  if (event.getPackageName() != null) {
                      String pkg = event.getPackageName().toString();
                      if (!pkg.contains("systemui")) {
                          activePkg = pkg;
                      }
                      if (isHomeOrSafeApp()) {
                          synchronized (activeLockedBoxes) { activeLockedBoxes.clear(); }
                          overlayView.setBoxes(Collections.emptyList(), false);
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              @Override
              public void onInterrupt() {}
          }
