name: Build Windows-Grade Ghaad AI APK v8

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Windows-Grade Zero-Flicker Android Project
        run: |
          mkdir -p android_build/app/src/main/java/com/ghaad/shield
          mkdir -p android_build/app/src/main/res/xml

          cat << 'EOF' > android_build/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GhaadShield"
          include ':app'
          EOF

          cat << 'EOF' > android_build/build.gradle
          plugins {
              id 'com.android.application' version '8.1.2' apply false
          }
          EOF

          cat << 'EOF' > android_build/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > android_build/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ghaad.shield'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ghaad.shield"
                  minSdk 24
                  targetSdk 33
                  versionCode 8
                  versionName "8.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.mlkit:face-detection:16.1.6'
              implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta5'
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>

              <application
                  android:label="Project Ghaad Shield"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service android:name=".GhaadGuardService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>

                  <receiver android:name=".GhaadAdminReceiver"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data android:name="android.app.device_admin"
                          android:resource="@xml/device_admin"/>
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_build/app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:accessibilityFlags="flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:notificationTimeout="15"/>
          EOF

          cat << 'EOF' > android_build/app/src/main/res/xml/device_admin.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock/>
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/GhaadAdminReceiver.java
          package com.ghaad.shield;
          import android.app.admin.DeviceAdminReceiver;
          public class GhaadAdminReceiver extends DeviceAdminReceiver {}
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/CensorOverlayView.java
          package com.ghaad.shield;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.view.View;
          import java.util.ArrayList;
          import java.util.List;

          public class CensorOverlayView extends View {
              private final List<Rect> blockedRects = new ArrayList<>();
              private final Paint boxPaint = new Paint();
              private final Paint borderPaint = new Paint();
              private final Paint textPaint = new Paint();

              public CensorOverlayView(Context context) {
                  super(context);
                  // Exact Windows-style solid pitch-black box with thin red border
                  boxPaint.setColor(Color.BLACK);
                  boxPaint.setAlpha(255);
                  boxPaint.setStyle(Paint.Style.FILL);

                  borderPaint.setColor(Color.rgb(200, 30, 30));
                  borderPaint.setStyle(Paint.Style.STROKE);
                  borderPaint.setStrokeWidth(3f);

                  textPaint.setColor(Color.WHITE);
                  textPaint.setTextSize(34f);
                  textPaint.setTextAlign(Paint.Align.CENTER);
                  textPaint.setFakeBoldText(true);
              }

              public synchronized void updateBoxes(List<Rect> newRects) {
                  blockedRects.clear();
                  if (newRects != null) {
                      blockedRects.addAll(newRects);
                  }
                  postInvalidate();
              }

              public synchronized boolean hasActiveBoxes() {
                  return !blockedRects.isEmpty();
              }

              @Override
              protected synchronized void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  for (Rect r : blockedRects) {
                      canvas.drawRect(r, boxPaint);
                      canvas.drawRect(r, borderPaint);
                      canvas.drawText("BLOCKED", r.centerX(), r.centerY(), textPaint);
                  }
              }
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/GhaadGuardService.java
          package com.ghaad.shield;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.ColorSpace;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.hardware.HardwareBuffer;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.face.Face;
          import com.google.mlkit.vision.face.FaceDetection;
          import com.google.mlkit.vision.face.FaceDetector;
          import com.google.mlkit.vision.face.FaceDetectorOptions;
          import com.google.mlkit.vision.segmentation.Segmentation;
          import com.google.mlkit.vision.segmentation.SegmentationMask;
          import com.google.mlkit.vision.segmentation.Segmenter;
          import com.google.mlkit.vision.segmentation.selfie.SelfieSegmenterOptions;

          import java.nio.ByteBuffer;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class GhaadGuardService extends AccessibilityService {
              public static GhaadGuardService instance;
              public static volatile String currentPkg = "";
              public static volatile long pauseLockUntil = 0;

              private WindowManager windowManager;
              private CensorOverlayView overlayView;
              private FaceDetector faceDetector;
              private Segmenter bodySegmenter;
              private Handler mainHandler;
              private ExecutorService cameraExecutor;
              private volatile boolean isProcessing = false;
              private String defaultLauncherPkg = "com.sec.android.app.launcher";

              // Zero-Flicker Persistence Memory (Keeps box steady like Windows!)
              private List<Rect> lastValidBoxes = new ArrayList<>();
              private long lastDetectionTimestamp = 0;
              private static final long HOLD_DURATION_MS = 1100; // Hold box steady for 1.1s even during fast motion

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  mainHandler = new Handler(Looper.getMainLooper());
                  cameraExecutor = Executors.newSingleThreadExecutor();
                  detectDefaultLauncher();

                  try {
                      windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                      overlayView = new CensorOverlayView(this);
                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT
                      );
                      params.gravity = Gravity.TOP | Gravity.START;
                      windowManager.addView(overlayView, params);
                  } catch (Exception ignored) {}

                  FaceDetectorOptions faceOpts = new FaceDetectorOptions.Builder()
                          .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_FAST)
                          .setMinFaceSize(0.045f)
                          .build();
                  faceDetector = FaceDetection.getClient(faceOpts);

                  SelfieSegmenterOptions segOpts = new SelfieSegmenterOptions.Builder()
                          .setDetectorMode(SelfieSegmenterOptions.STREAM_MODE)
                          .enableRawSizeMask()
                          .build();
                  bodySegmenter = Segmentation.getClient(segOpts);

                  mainHandler.postDelayed(fastScanLoop, 200);
              }

              private void detectDefaultLauncher() {
                  try {
                      Intent intent = new Intent(Intent.ACTION_MAIN);
                      intent.addCategory(Intent.CATEGORY_HOME);
                      ResolveInfo res = getPackageManager().resolveActivity(intent, PackageManager.MATCH_DEFAULT_ONLY);
                      if (res != null && res.activityInfo != null) {
                          defaultLauncherPkg = res.activityInfo.packageName.toLowerCase();
                      }
                  } catch (Exception ignored) {}
              }

              // Never block Home Screen Wallpaper, Keyboard, System Settings, or Project Ghaad itself!
              private boolean isWhitelistedApp() {
                  String p = currentPkg.toLowerCase();
                  if (p.isEmpty()) return false;
                  return p.equals(defaultLauncherPkg)
                          || p.contains("launcher")
                          || p.contains("quickstep")
                          || p.contains("com.ghaad.shield")
                          || p.contains("inputmethod")
                          || p.contains("honeyboard")
                          || p.contains("android.settings");
              }

              private final Runnable fastScanLoop = new Runnable() {
                  @Override
                  public void run() {
                      if (isWhitelistedApp()) {
                          lastValidBoxes.clear();
                          overlayView.updateBoxes(Collections.emptyList());
                          mainHandler.postDelayed(this, 250);
                          return;
                      }

                      if (!isProcessing && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          isProcessing = true;
                          if (overlayView.hasActiveBoxes()) {
                              // ZERO-FLICKER TRICK: Hide for only 10ms to grab hardware buffer, then immediately restore!
                              overlayView.setAlpha(0f);
                              mainHandler.postDelayed(() -> captureScreenInvisible(), 12);
                          } else {
                              captureScreenInvisible();
                          }
                      }
                      // Android 11+ allows takeScreenshot once every ~330ms
                      mainHandler.postDelayed(this, 340);
                  }
              };

              private void captureScreenInvisible() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {
                      overlayView.setAlpha(1f);
                      isProcessing = false;
                      return;
                  }
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, cameraExecutor, new TakeScreenshotCallback() {
                          @Override
                          public void onSuccess(ScreenshotResult screenshotResult) {
                              // IMMEDIATELY restore black curtain before AI even starts processing! Zero flicker!
                              mainHandler.post(() -> overlayView.setAlpha(1f));
                              try {
                                  HardwareBuffer hb = screenshotResult.getHardwareBuffer();
                                  ColorSpace cs = screenshotResult.getColorSpace();
                                  Bitmap hwBmp = Bitmap.wrapHardwareBuffer(hb, cs);
                                  if (hwBmp != null) {
                                      int origW = hwBmp.getWidth();
                                      int origH = hwBmp.getHeight();
                                      int smallW = Math.max(120, origW / 3);
                                      int smallH = Math.max(120, origH / 3);
                                      Bitmap softBmp = hwBmp.copy(Bitmap.Config.ARGB_8888, false);
                                      hwBmp.recycle();
                                      hb.close();

                                      Bitmap scaledBmp = Bitmap.createScaledBitmap(softBmp, smallW, smallH, false);
                                      softBmp.recycle();
                                      analyzeFrameWithAi(scaledBmp, origW, origH);
                                  } else {
                                      hb.close();
                                      isProcessing = false;
                                  }
                              } catch (Exception e) {
                                  isProcessing = false;
                              }
                          }

                          @Override
                          public void onFailure(int errorCode) {
                              // If rate-limited by Android OS, keep existing black box steady!
                              mainHandler.post(() -> overlayView.setAlpha(1f));
                              isProcessing = false;
                          }
                      });
                  } catch (Exception e) {
                      overlayView.setAlpha(1f);
                      isProcessing = false;
                  }
              }

              private void analyzeFrameWithAi(Bitmap bmp, int screenW, int screenH) {
                  InputImage image = InputImage.fromBitmap(bmp, 0);
                  final float scaleX = (float) screenW / bmp.getWidth();
                  final float scaleY = (float) screenH / bmp.getHeight();

                  bodySegmenter.process(image)
                          .addOnSuccessListener(mask -> {
                              List<Rect> rawBoxes = new ArrayList<>();

                              // 1. Check Full-Body Silhouette + Skin Ratio (Blocks Bikini, Dance, Intimate & Female Bodies)
                              Rect bodyBox = analyzeBodyAndSkinMask(bmp, mask, screenW, screenH);
                              if (bodyBox != null) {
                                  rawBoxes.add(bodyBox);
                              }

                              // 2. Check Faces (Verify human skin & female/hair features so White Robots are NEVER blocked!)
                              faceDetector.process(image)
                                      .addOnSuccessListener(faces -> {
                                          for (Face face : faces) {
                                              Rect fb = face.getBoundingBox();
                                              if (isTargetFaceOrWoman(bmp, fb)) {
                                                  int fw = fb.width();
                                                  int fh = fb.height();
                                                  int left = Math.max(0, (int) ((fb.left - fw * 1.3f) * scaleX));
                                                  int top = Math.max(0, (int) ((fb.top - fh * 0.6f) * scaleY));
                                                  int right = Math.min(screenW, (int) ((fb.right + fw * 1.3f) * scaleX));
                                                  int bottom = Math.min(screenH, (int) ((fb.bottom + fh * 4.2f) * scaleY));
                                                  rawBoxes.add(new Rect(left, top, right, bottom));
                                              }
                                          }
                                          updateSteadyOverlay(mergeOverlappingBoxes(rawBoxes));
                                          bmp.recycle();
                                      })
                                      .addOnFailureListener(e -> {
                                          updateSteadyOverlay(mergeOverlappingBoxes(rawBoxes));
                                          bmp.recycle();
                                      });
                          })
                          .addOnFailureListener(e -> {
                              bmp.recycle();
                              isProcessing = false;
                          });
              }

              // Verifies real human skin & female/long-hair/exposed-chest features (Ignores 3D Robots & suited men!)
              private boolean isTargetFaceOrWoman(Bitmap bmp, Rect fb) {
                  int w = bmp.getWidth();
                  int h = bmp.getHeight();
                  int cx = Math.max(0, Math.min(w - 1, fb.centerX()));
                  int cy = Math.max(0, Math.min(h - 1, fb.centerY()));

                  // 1. Check if face has real human skin tone (Rejects White/Grey Robots!)
                  int skinPixels = 0, faceSamples = 0;
                  int l = Math.max(0, fb.left), r = Math.min(w - 1, fb.right);
                  int t = Math.max(0, fb.top), b = Math.min(h - 1, fb.bottom);
                  for (int y = t; y <= b; y += 3) {
                      for (int x = l; x <= r; x += 3) {
                          faceSamples++;
                          if (isSkinPixel(bmp.getPixel(x, y))) skinPixels++;
                      }
                  }
                  if (faceSamples == 0 || (skinPixels * 100 / faceSamples) < 18) {
                      return false; // Not a real human face (e.g., Robot or Cartoon Icon)
                  }

                  // 2. Check chest/shoulder skin exposure below face OR long hair around neck/shoulders
                  int bodyTop = Math.min(h - 1, b);
                  int bodyBot = Math.min(h - 1, b + fb.height() * 2);
                  int bodyLeft = Math.max(0, l - fb.width() / 2);
                  int bodyRight = Math.min(w - 1, r + fb.width() / 2);

                  int bodySkin = 0, darkHairSide = 0, bodyTotal = 0;
                  for (int y = bodyTop; y <= bodyBot; y += 3) {
                      for (int x = bodyLeft; x <= bodyRight; x += 3) {
                          bodyTotal++;
                          int px = bmp.getPixel(x, y);
                          if (isSkinPixel(px)) bodySkin++;
                      }
                  }

                  // Check long hair around temple/neck sides (typical for women news anchors & actresses)
                  int neckTop = Math.max(0, cy);
                  int neckBot = Math.min(h - 1, b + fb.height() / 2);
                  int sideSamples = 0;
                  for (int y = neckTop; y <= neckBot; y += 3) {
                      int lx = Math.max(0, l - fb.width() / 3);
                      int rx = Math.min(w - 1, r + fb.width() / 3);
                      sideSamples += 2;
                      if (isHairPixel(bmp.getPixel(lx, y))) darkHairSide++;
                      if (isHairPixel(bmp.getPixel(rx, y))) darkHairSide++;
                  }

                  boolean hasExposedSkin = bodyTotal > 0 && (bodySkin * 100 / bodyTotal) >= 14;
                  boolean hasLongHair = sideSamples > 0 && (darkHairSide * 100 / sideSamples) >= 35;

                  return hasExposedSkin || hasLongHair;
              }

              private Rect analyzeBodyAndSkinMask(Bitmap bmp, SegmentationMask mask, int screenW, int screenH) {
                  ByteBuffer buffer = mask.getBuffer();
                  buffer.rewind();
                  int maskW = mask.getWidth();
                  int maskH = mask.getHeight();

                  int minX = maskW, maxX = 0, minY = maskH, maxY = 0;
                  int humanPixels = 0, skinOnBodyPixels = 0, totalSampled = 0;

                  for (int y = 0; y < maskH; y += 2) {
                      for (int x = 0; x < maskW; x += 2) {
                          float conf = buffer.getFloat((y * maskW + x) * 4);
                          totalSampled++;
                          if (conf > 0.5f) {
                              humanPixels++;
                              int px = bmp.getPixel(Math.min(bmp.getWidth() - 1, x), Math.min(bmp.getHeight() - 1, y));
                              if (isSkinPixel(px)) {
                                  skinOnBodyPixels++;
                              }
                              if (x < minX) minX = x;
                              if (x > maxX) maxX = x;
                              if (y < minY) minY = y;
                              if (y > maxY) maxY = y;
                          }
                      }
                  }

                  // Block if human silhouette has noticeable skin exposure (swimsuit, dance, cleavage, close-up)
                  if (humanPixels > 30 && (skinOnBodyPixels * 100 / humanPixels) >= 16 && maxX > minX && maxY > minY) {
                      float scaleX = (float) screenW / maskW;
                      float scaleY = (float) screenH / maskH;
                      int padX = (int) (screenW * 0.05f);
                      int padY = (int) (screenH * 0.05f);
                      return new Rect(
                              Math.max(0, (int) (minX * scaleX) - padX),
                              Math.max(0, (int) (minY * scaleY) - padY),
                              Math.min(screenW, (int) (maxX * scaleX) + padX),
                              Math.min(screenH, (int) (maxY * scaleY) + padY)
                      );
                  }
                  return null;
              }

              private boolean isSkinPixel(int px) {
                  int R = (px >> 16) & 0xFF;
                  int G = (px >> 8) & 0xFF;
                  int B = px & 0xFF;
                  if (R > 90 && G > 38 && B > 18 && R > G && R > B && (R - Math.min(G, B)) > 18) {
                      int Cr = 128 + ((112 * R - 93 * G - 18 * B) >> 8);
                      int Cb = 128 + ((-37 * R - 74 * G + 112 * B) >> 8);
                      return Cr >= 133 && Cr <= 175 && Cb >= 77 && Cb <= 128;
                  }
                  return false;
              }

              private boolean isHairPixel(int px) {
                  int R = (px >> 16) & 0xFF;
                  int G = (px >> 8) & 0xFF;
                  int B = px & 0xFF;
                  return R < 65 && G < 60 && B < 60;
              }

              // Merges overlapping boxes into ONE clean Windows-style rectangle!
              private List<Rect> mergeOverlappingBoxes(List<Rect> boxes) {
                  if (boxes.size() <= 1) return boxes;
                  List<Rect> merged = new ArrayList<>(boxes);
                  boolean changed = true;
                  while (changed) {
                      changed = false;
                      for (int i = 0; i < merged.size(); i++) {
                          for (int j = i + 1; j < merged.size(); j++) {
                              Rect a = merged.get(i);
                              Rect b = merged.get(j);
                              // Merge if overlapping or close to each other
                              Rect expandedA = new Rect(a.left - 60, a.top - 60, a.right + 60, a.bottom + 60);
                              if (Rect.intersects(expandedA, b)) {
                                  a.union(b);
                                  merged.remove(j);
                                  changed = true;
                                  break;
                              }
                          }
                          if (changed) break;
                      }
                  }
                  return merged;
              }

              private void updateSteadyOverlay(List<Rect> newBoxes) {
                  mainHandler.post(() -> {
                      long now = System.currentTimeMillis();
                      if (!newBoxes.isEmpty()) {
                          // Smoothly union with recent boxes if within 450ms for rock-solid coverage
                          lastValidBoxes = newBoxes;
                          lastDetectionTimestamp = now;
                          overlayView.updateBoxes(newBoxes);
                      } else {
                          // Hold previous black box for 1.1 seconds so it NEVER drops during fast camera cuts!
                          if (now - lastDetectionTimestamp > HOLD_DURATION_MS) {
                              lastValidBoxes.clear();
                              overlayView.updateBoxes(Collections.emptyList());
                          } else {
                              overlayView.updateBoxes(lastValidBoxes);
                          }
                      }
                      isProcessing = false;
                  });
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  if (event.getPackageName() != null) {
                      String pkg = event.getPackageName().toString();
                      if (!pkg.contains("systemui")) {
                          currentPkg = pkg;
                      }
                      if (isWhitelistedApp()) {
                          lastValidBoxes.clear();
                          overlayView.updateBoxes(Collections.emptyList());
                      }
                  }

                  if (System.currentTimeMillis() < pauseLockUntil) return;

                  // Instant Anti-Uninstall & Anti-Force-Stop Protection
                  String pkg = currentPkg.toLowerCase();
                  if (pkg.contains("settings") || pkg.contains("packageinstaller") || pkg.contains("lool") || pkg.contains("security")) {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root != null) {
                          String text = collectText(root).toLowerCase();
                          root.recycle();
                          if (text.contains("project ghaad") || text.contains("ghaad shield")) {
                              if (text.contains("uninstall") || text.contains("force stop") || text.contains("storage")
                                      || text.contains("permissions") || text.contains("deactivate") || text.contains("turn off")
                                      || text.contains("installed") || text.contains("battery") || text.contains("app info")) {
                                  performGlobalAction(GLOBAL_ACTION_BACK);
                                  performGlobalAction(GLOBAL_ACTION_HOME);
                              }
                          }
                      }
                  }
              }

              private String collectText(AccessibilityNodeInfo node) {
                  if (node == null) return "";
                  StringBuilder sb = new StringBuilder();
                  if (node.getText() != null) sb.append(node.getText()).append(" ");
                  if (node.getContentDescription() != null) sb.append(node.getContentDescription()).append(" ");
                  int count = node.getChildCount();
                  for (int i = 0; i < count; i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) {
                          sb.append(collectText(child));
                          child.recycle();
                      }
                  }
                  return sb.toString();
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              @Override
              public void onInterrupt() {}
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/MainActivity.java
          package com.ghaad.shield;

          import android.app.Activity;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private Button btnAdmin, btnGuard;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setBackgroundColor(Color.parseColor("#0b0f19"));
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(60, 60, 60, 60);

                  TextView title = new TextView(this);
                  title.setText("PROJECT GHAAD v8.0\nWindows-Grade Steady AI Blocker");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(21);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 25);

                  // Developer Unlock: Hold title for 3s to unlock Settings for 60s
                  title.setOnLongClickListener(v -> {
                      GhaadGuardService.pauseLockUntil = System.currentTimeMillis() + 60000;
                      DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                      ComponentName comp = new ComponentName(this, GhaadAdminReceiver.class);
                      if (dpm != null && dpm.isAdminActive(comp)) {
                          dpm.removeActiveAdmin(comp);
                      }
                      Toast.makeText(this, "Unlocked for 60 seconds!", Toast.LENGTH_LONG).show();
                      updateStatus();
                      return true;
                  });
                  layout.addView(title);

                  TextView sub = new TextView(this);
                  sub.setText("Zero-Flicker Unified Black Box\nIgnores Robots, Men & Home Wallpaper.");
                  sub.setTextColor(Color.parseColor("#94a3b8"));
                  sub.setTextSize(14);
                  sub.setGravity(Gravity.CENTER);
                  sub.setPadding(0, 0, 0, 50);
                  layout.addView(sub);

                  btnAdmin = new Button(this);
                  btnAdmin.setOnClickListener(v -> {
                      ComponentName comp = new ComponentName(this, GhaadAdminReceiver.class);
                      Intent intent = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                      intent.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, comp);
                      startActivity(intent);
                  });
                  layout.addView(btnAdmin);

                  TextView space = new TextView(this);
                  space.setHeight(35);
                  layout.addView(space);

                  btnGuard = new Button(this);
                  btnGuard.setOnClickListener(v -> {
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                  });
                  layout.addView(btnGuard);

                  setContentView(layout);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateStatus();
              }

              private void updateStatus() {
                  DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                  ComponentName comp = new ComponentName(this, GhaadAdminReceiver.class);
                  boolean s1 = dpm != null && dpm.isAdminActive(comp);
                  btnAdmin.setText((s1 ? "✅ " : "❌ ") + "Step 1: Lock Uninstall (Device Admin)");

                  boolean s2 = GhaadGuardService.instance != null;
                  btnGuard.setText((s2 ? "✅ " : "❌ ") + "Step 2: Start Steady AI Blocker");
              }
          }
          EOF

      - name: Build APK with Gradle
        working-directory: android_build
        run: gradle assembleDebug

      - name: Prepare APK File
        run: cp android_build/app/build/outputs/apk/debug/app-debug.apk Ghaad_Mobile.apk

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghaad_Mobile_APK
          path: Ghaad_Mobile.apk
