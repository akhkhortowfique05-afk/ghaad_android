              private List<Rect> currentBoxes = new ArrayList<>();
              private long lastDetectionTime = 0;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  mainHandler = new Handler(Looper.getMainLooper());
                  executor = Executors.newSingleThreadExecutor();

                  try {
                      windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                      overlayView = new CensorOverlayView(this);
                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT
                      );
                      params.gravity = Gravity.TOP | Gravity.START;
                      windowManager.addView(overlayView, params);
                  } catch (Exception ignored) {}

                  executor.execute(() -> {
                      nudeNetDetector = new NudeNetOnnxDetector(GhaadGuardService.this);
                      mainHandler.post(() -> overlayView.updateState(Collections.emptyList(), nudeNetDetector.statusMsg));
                  });

                  mainHandler.postDelayed(scanLoop, 450);
              }

              private boolean isHomeOrSafeApp() {
                  String p = activePkg.toLowerCase();
                  if (p.isEmpty()) return false;
                  return p.contains("launcher") || p.contains("sec.android.app.launcher")
                          || p.contains("quickstep") || p.contains("com.ghaad.shield")
                          || p.contains("inputmethod") || p.contains("honeyboard")
                          || p.contains("android.settings") || p.contains("dialer") || p.contains("bkash");
              }

              private final Runnable scanLoop = new Runnable() {
                  @Override
                  public void run() {
                      if (isHomeOrSafeApp()) {
                          currentBoxes.clear();
                          overlayView.updateState(Collections.emptyList(), "");
                          mainHandler.postDelayed(this, 450);
                          return;
                      }

                      if (nudeNetDetector == null || !nudeNetDetector.isReady()) {
                          String msg = nudeNetDetector != null ? nudeNetDetector.statusMsg : "LOADING V17...";
                          overlayView.updateState(Collections.emptyList(), msg);
                          mainHandler.postDelayed(this, 500);
                          return;
                      }

                      if (!isBusy && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          isBusy = true;
                          // Crucial Fix for 01:30-02:34:
                          // If we don't hide the black box for 12ms during screenshot, the black box covers the girls in the screenshot!
                          // Hiding for just 12 milliseconds (1 frame) is invisible to the human eye, but lets the AI see the entire screen cleanly!
                          if (!currentBoxes.isEmpty()) {
                              overlayView.setVisibility(View.INVISIBLE);
                              mainHandler.postDelayed(() -> captureCleanScreen(), 14);
                          } else {
                              captureCleanScreen();
                          }
                      }
                      mainHandler.postDelayed(this, 1020);
                  }
              };

              private void captureCleanScreen() {
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, executor, new TakeScreenshotCallback() {
                          @Override
                          public void onSuccess(ScreenshotResult result) {
                              // Immediately restore black overlay in 14ms so human eye sees zero flicker!
                              mainHandler.post(() -> overlayView.setVisibility(View.VISIBLE));
                              try {
                                  HardwareBuffer hb = result.getHardwareBuffer();
                                  ColorSpace cs = result.getColorSpace();
                                  Bitmap hwBmp = Bitmap.wrapHardwareBuffer(hb, cs);
                                  if (hwBmp != null) {
                                      int origW = hwBmp.getWidth();
                                      int origH = hwBmp.getHeight();
                                      Bitmap softBmp = hwBmp.copy(Bitmap.Config.ARGB_8888, false);
                                      hwBmp.recycle();
                                      hb.close();

                                      scanCounter++;
                                      List<Rect> detected = nudeNetDetector.detectAllTargets(softBmp, origW, origH);
                                      softBmp.recycle();

                                      List<Rect> merged = mergeBoxesCleanly(detected, origH);
                                      final long now = System.currentTimeMillis();

                                      mainHandler.post(() -> {
                                          if (!merged.isEmpty()) {
                                              currentBoxes = merged;
                                              lastDetectionTime = now;
                                          } else if (now - lastDetectionTime > 1200) {
                                              // Hold box for 1.2s during brief camera flashes so it never drops mid-scene
                                              currentBoxes.clear();
                                          }
                                          String hud = String.format(Locale.US, "V17 #%d | Cls:%d (%.0f%%) | Box:%d",
                                                  scanCounter, nudeNetDetector.lastBestClass,
                                                  nudeNetDetector.lastMaxScore * 100f, currentBoxes.size());
                                          if (!isHomeOrSafeApp()) {
                                              overlayView.updateState(currentBoxes, hud);
                                          } else {
                                              overlayView.updateState(Collections.emptyList(), "");
                                          }
                                          isBusy = false;
                                      });
                                  } else {
                                      hb.close();
                                      isBusy = false;
                                  }
                              } catch (Exception e) {
                                  isBusy = false;
                              }
                          }

                          @Override
                          public void onFailure(int errorCode) {
                              mainHandler.post(() -> overlayView.setVisibility(View.VISIBLE));
                              isBusy = false;
                          }
                      });
                  } catch (Exception e) {
                      overlayView.setVisibility(View.VISIBLE);
                      isBusy = false;
                  }
              }

              private List<Rect> mergeBoxesCleanly(List<Rect> boxes, int screenH) {
                  if (boxes.size() <= 1) return boxes;
                  List<Rect> merged = new ArrayList<>(boxes);
                  boolean changed = true;
                  while (changed) {
                      changed = false;
                      for (int i = 0; i < merged.size(); i++) {
                          for (int j = i + 1; j < merged.size(); j++) {
                              Rect a = merged.get(i);
                              Rect b = merged.get(j);
                              Rect exp = new Rect(a.left - 45, a.top - 45, a.right + 45, a.bottom + 45);
                              if (Rect.intersects(exp, b)) {
                                  Rect u = new Rect(a);
                                  u.union(b);
                                  if (u.height() < (int) (screenH * 0.78f)) {
                                      merged.set(i, u);
                                      merged.remove(j);
                                      changed = true;
                                      break;
                                  }
                              }
                          }
                          if (changed) break;
                      }
                  }
                  return merged;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  if (event.getEventType() == AccessibilityEvent.TYPE_VIEW_SCROLLED) {
                      currentBoxes.clear();
                      overlayView.updateState(Collections.emptyList(), "V17: SCROLLED");
                  }

                  if (event.getPackageName() != null) {
                      String pkg = event.getPackageName().toString();
                      if (!pkg.contains("systemui")) {
                          activePkg = pkg;
                      }
                      if (isHomeOrSafeApp()) {
                          currentBoxes.clear();
                          overlayView.updateState(Collections.emptyList(), "");
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              @Override
              public void onInterrupt() {}
          }
