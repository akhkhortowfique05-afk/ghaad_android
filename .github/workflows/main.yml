                                      int mLeft = Math.max(0, (int) ((fb.left - fw * 1.5f) * scaleX));
                                      int mTop = Math.max(0, (int) ((fb.top - fh * 0.4f) * scaleY));
                                      int mRight = Math.min(screenW, (int) ((fb.right + fw * 1.5f) * scaleX));
                                      int mBottom = Math.min(screenH, (int) ((fb.bottom + fh * 3.5f) * scaleY));
                                      maleSafeZones.add(new Rect(mLeft, mTop, mRight, mBottom));
