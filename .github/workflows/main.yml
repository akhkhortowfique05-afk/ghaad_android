                  if (neckSamples > 0 && (darkHairWrap * 100 / neckSamples) >= 50) {
                      return false; // Long hair or dark hijab framing neck -> Woman!
                  }

                  // Otherwise, if no long hair wrap and no chest skin exposure -> Clothed Male
                  return true;
              }

              private int getLuminance(int px) {
                  int R = (px >> 16) & 0xFF;
                  int G = (px >> 8) & 0xFF;
                  int B = px & 0xFF;
                  return (R * 299 + G * 587 + B * 114) / 1000;
              }

              // V10 Skin Cluster Detector — Tuned to catch Fullscreen Dance/Belly/Cleavage (00:18-00:42) & Close-up Kissing (00:22, 00:34, 00:40)!
              private List<Rect> detectExposedBodyAndKissClusters(Bitmap bmp, int screenW, int screenH, float scaleX, float scaleY) {
                  List<Rect> boxes = new ArrayList<>();
                  int w = bmp.getWidth();
                  int h = bmp.getHeight();
                  int cols = 16, rows = 24;
                  int cellW = w / cols, cellH = h / rows;
                  if (cellW < 4 || cellH < 4) return boxes;

                  boolean[][] skinGrid = new boolean[rows][cols];
                  for (int r = 1; r < rows - 1; r++) {
                      for (int c = 1; c < cols - 1; c++) {
                          int skin = 0, total = 0;
                          for (int dy = 1; dy < cellH; dy += 2) {
                              for (int dx = 1; dx < cellW; dx += 2) {
                                  total++;
                                  if (isSkin(bmp.getPixel(c * cellW + dx, r * cellH + dy))) {
                                      skin++;
                                  }
                              }
                          }
                          if (total > 0 && (skin * 100 / total) >= 44) {
                              skinGrid[r][c] = true;
                          }
                      }
                  }

                  boolean[][] visited = new boolean[rows][cols];
                  for (int r = 1; r < rows - 1; r++) {
                      for (int c = 1; c < cols - 1; c++) {
                          if (skinGrid[r][c] && !visited[r][c]) {
                              int minR = r, maxR = r, minC = c, maxC = c, count = 0;
