                                  int bottom = Math.min(screenH, (int) (((maxR + 2) * cellH) * scaleY));
                                  boxes.add(new Rect(left, top, right, bottom));
                              }
                          }
                      }
                  }
                  return boxes;
              }

              private boolean isSkin(int px) {
                  int R = (px >> 16) & 0xFF;
                  int G = (px >> 8) & 0xFF;
                  int B = px & 0xFF;
                  if (R > 75 && G > 32 && B > 18 && R > G && G > B && (R - G) > 13 && (R - B) < 125) {
                      int Cr = 128 + ((112 * R - 93 * G - 18 * B) >> 8);
                      int Cb = 128 + ((-37 * R - 74 * G + 112 * B) >> 8);
                      return Cr >= 134 && Cr <= 174 && Cb >= 79 && Cb <= 126;
                  }
                  return false;
              }

              private List<Rect> mergeBoxesCleanly(List<Rect> boxes, int screenH) {
                  if (boxes.size() <= 1) return boxes;
                  List<Rect> merged = new ArrayList<>(boxes);
                  boolean changed = true;
                  while (changed) {
                      changed = false;
                      for (int i = 0; i < merged.size(); i++) {
                          for (int j = i + 1; j < merged.size(); j++) {
                              Rect a = merged.get(i);
                              Rect b = merged.get(j);
                              Rect exp = new Rect(a.left - 35, a.top - 35, a.right + 35, a.bottom + 35);
                              if (Rect.intersects(exp, b)) {
                                  Rect u = new Rect(a);
                                  u.union(b);
                                  if (u.height() < (int) (screenH * 0.68f)) {
                                      merged.set(i, u);
                                      merged.remove(j);
                                      changed = true;
                                      break;
                                  }
                              }
                          }
                          if (changed) break;
                      }
                  }
                  return merged;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  if (event.getPackageName() != null) {
                      String pkg = event.getPackageName().toString();
                      if (!pkg.contains("systemui")) {
                          activePkg = pkg;
                      }
                      if (isHomeOrSafeApp()) {
                          lastValidBoxes.clear();
                          overlayView.setBoxes(Collections.emptyList(), false);
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              @Override
              public void onInterrupt() {}
          }
