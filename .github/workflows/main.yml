                  addSpace(layout);

                  // Safe 1-Click Uninstall Button so users never get stuck!
                  btnUninstall = new Button(this);
                  btnUninstall.setText("🗑 Unlock & Safely Uninstall App");
                  btnUninstall.setOnClickListener(v -> {
                      GhaadGuardService.pauseProtectionUntil = System.currentTimeMillis() + 120000;
                      DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                      ComponentName comp = new ComponentName(this, GhaadAdminReceiver.class);
                      if (dpm != null && dpm.isAdminActive(comp)) {
                          dpm.removeActiveAdmin(comp);
                      }
                      Intent intent = new Intent(Intent.ACTION_DELETE);
                      intent.setData(Uri.parse("package:" + getPackageName()));
                      startActivity(intent);
                  });
                  layout.addView(btnUninstall);

                  setContentView(layout);
              }

              private void addSpace(LinearLayout layout) {
                  TextView s = new TextView(this);
                  s.setHeight(25);
                  layout.addView(s);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateStatus();
              }

              private void updateStatus() {
                  DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                  ComponentName comp = new ComponentName(this, GhaadAdminReceiver.class);
                  boolean s1 = dpm != null && dpm.isAdminActive(comp);
                  btnAdmin.setText((s1 ? "✅ " : "❌ ") + "Step 1: Anti-Uninstall Lock (Optional)");

                  boolean s2 = GhaadGuardService.instance != null;
                  btnGuard.setText((s2 ? "✅ " : "❌ ") + "Step 2: Start NudeNet ONNX AI Shield");
              }
          }
          EOF

      - name: Build APK with Gradle
        working-directory: android_build
        run: gradle assembleDebug

      - name: Prepare APK File
        run: cp android_build/app/build/outputs/apk/debug/app-debug.apk Ghaad_V12_NudeNet.apk

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghaad_V12_NudeNet_APK
          path: Ghaad_V12_NudeNet.apk
