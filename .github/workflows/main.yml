name: Build Ultra-Fast Ghaad Full-Body AI APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Full-Body AI Blocker Android Project
        run: |
          mkdir -p android_build/app/src/main/java/com/ghaad/shield
          mkdir -p android_build/app/src/main/res/xml

          cat << 'EOF' > android_build/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GhaadShield"
          include ':app'
          EOF

          cat << 'EOF' > android_build/build.gradle
          plugins {
              id 'com.android.application' version '8.1.2' apply false
          }
          EOF

          cat << 'EOF' > android_build/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > android_build/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ghaad.shield'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ghaad.shield"
                  minSdk 24
                  targetSdk 33
                  versionCode 7
                  versionName "7.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              // 1. Face Detector
              implementation 'com.google.mlkit:face-detection:16.1.6'
              // 2. Full-Body Pose Detector (Detects Head, Shoulders, Chest, Hips, Legs)
              implementation 'com.google.mlkit:pose-detection-accurate:18.0.0-beta4'
              // 3. Human Body Contour & Silhouette Segmenter
              implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta5'
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>

              <application
                  android:label="Project Ghaad Shield"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <!-- Core AI Screen Scanner & Anti-Uninstall Service -->
                  <service android:name=".GhaadGuardService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>

                  <!-- Device Admin Lock -->
                  <receiver android:name=".GhaadAdminReceiver"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data android:name="android.app.device_admin"
                          android:resource="@xml/device_admin"/>
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_build/app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:accessibilityFlags="flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:notificationTimeout="15"/>
          EOF

          cat << 'EOF' > android_build/app/src/main/res/xml/device_admin.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock/>
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/GhaadAdminReceiver.java
          package com.ghaad.shield;
          import android.app.admin.DeviceAdminReceiver;
          public class GhaadAdminReceiver extends DeviceAdminReceiver {}
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/CensorOverlayView.java
          package com.ghaad.shield;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.view.View;
          import java.util.ArrayList;
          import java.util.List;

          public class CensorOverlayView extends View {
              private final List<Rect> blockedRects = new ArrayList<>();
              private final Paint boxPaint = new Paint();
              private final Paint borderPaint = new Paint();
              private final Paint textPaint = new Paint();

              public CensorOverlayView(Context context) {
                  super(context);
                  // 100% Pitch Black Solid Fill
                  boxPaint.setColor(Color.BLACK);
                  boxPaint.setAlpha(255);
                  boxPaint.setStyle(Paint.Style.FILL);

                  borderPaint.setColor(Color.RED);
                  borderPaint.setStyle(Paint.Style.STROKE);
                  borderPaint.setStrokeWidth(6f);

                  textPaint.setColor(Color.WHITE);
                  textPaint.setTextSize(38f);
                  textPaint.setTextAlign(Paint.Align.CENTER);
                  textPaint.setFakeBoldText(true);
              }

              public synchronized void updateBoxes(List<Rect> newRects) {
                  blockedRects.clear();
                  if (newRects != null) {
                      blockedRects.addAll(newRects);
                  }
                  postInvalidate();
              }

              @Override
              protected synchronized void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  for (Rect r : blockedRects) {
                      canvas.drawRect(r, boxPaint);
                      canvas.drawRect(r, borderPaint);
                      canvas.drawText("GHAAD BLOCKED", r.centerX(), r.centerY(), textPaint);
                  }
              }
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/GhaadGuardService.java
          package com.ghaad.shield;

          import android.accessibilityservice.AccessibilityService;
          import android.graphics.Bitmap;
          import android.graphics.ColorSpace;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.hardware.HardwareBuffer;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.face.Face;
          import com.google.mlkit.vision.face.FaceDetection;
          import com.google.mlkit.vision.face.FaceDetector;
          import com.google.mlkit.vision.face.FaceDetectorOptions;
          import com.google.mlkit.vision.segmentation.Segmentation;
          import com.google.mlkit.vision.segmentation.SegmentationMask;
          import com.google.mlkit.vision.segmentation.Segmenter;
          import com.google.mlkit.vision.segmentation.selfie.SelfieSegmenterOptions;

          import java.nio.ByteBuffer;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class GhaadGuardService extends AccessibilityService {
              public static GhaadGuardService instance;
              public static volatile String currentPkg = "";
              public static volatile long pauseLockUntil = 0;

              private WindowManager windowManager;
              private CensorOverlayView overlayView;
              private FaceDetector faceDetector;
              private Segmenter bodySegmenter;
              private Handler mainHandler;
              private ExecutorService cameraExecutor;
              private volatile boolean isProcessing = false;
              private long lastEmptyTime = 0;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  mainHandler = new Handler(Looper.getMainLooper());
                  cameraExecutor = Executors.newSingleThreadExecutor();

                  // 1. Setup 100% Solid Black Accessibility Overlay (Works in Portrait + Fullscreen Landscape!)
                  try {
                      windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                      overlayView = new CensorOverlayView(this);
                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT
                      );
                      params.gravity = Gravity.TOP | Gravity.START;
                      windowManager.addView(overlayView, params);
                  } catch (Exception ignored) {}

                  // 2. Initialize Fast Face AI
                  FaceDetectorOptions faceOpts = new FaceDetectorOptions.Builder()
                          .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_FAST)
                          .setMinFaceSize(0.03f)
                          .build();
                  faceDetector = FaceDetection.getClient(faceOpts);

                  // 3. Initialize Full-Body Human Segmenter AI (Detects whole body even without face!)
                  SelfieSegmenterOptions segOpts = new SelfieSegmenterOptions.Builder()
                          .setDetectorMode(SelfieSegmenterOptions.STREAM_MODE)
                          .enableRawSizeMask()
                          .build();
                  bodySegmenter = Segmentation.getClient(segOpts);

                  // 4. Start Ultra-Fast Continuous AI Scanner Loop (Works in Full-Screen Video too!)
                  mainHandler.postDelayed(fastScanLoop, 200);
              }

              private boolean isSafeApp() {
                  String p = currentPkg.toLowerCase();
                  return p.contains("com.ghaad.shield") || p.contains("launcher") || p.contains("inputmethod") || p.contains("keyboard");
              }

              private final Runnable fastScanLoop = new Runnable() {
                  @Override
                  public void run() {
                      if (isSafeApp()) {
                          overlayView.updateBoxes(Collections.emptyList());
                          mainHandler.postDelayed(this, 250);
                          return;
                      }

                      if (!isProcessing && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          isProcessing = true;
                          // Hide overlay for just 15ms so screenshot captures clean video underneath
                          overlayView.setVisibility(View.INVISIBLE);
                          mainHandler.postDelayed(() -> takeHardwareScreenshot(), 18);
                      }
                      // Run every 220ms (~5 times per second, never stops on Fullscreen rotation!)
                      mainHandler.postDelayed(this, 220);
                  }
              };

              private void takeHardwareScreenshot() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {
                      isProcessing = false;
                      return;
                  }
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, cameraExecutor, new TakeScreenshotCallback() {
                          @Override
                          public void onSuccess(ScreenshotResult screenshotResult) {
                              mainHandler.post(() -> overlayView.setVisibility(View.VISIBLE));
                              try {
                                  HardwareBuffer hb = screenshotResult.getHardwareBuffer();
                                  ColorSpace cs = screenshotResult.getColorSpace();
                                  Bitmap hwBmp = Bitmap.wrapHardwareBuffer(hb, cs);
                                  if (hwBmp != null) {
                                      // Scale down by 2x for 4x faster AI speed!
                                      int origW = hwBmp.getWidth();
                                      int origH = hwBmp.getHeight();
                                      int smallW = Math.max(100, origW / 2);
                                      int smallH = Math.max(100, origH / 2);
                                      Bitmap softBmp = hwBmp.copy(Bitmap.Config.ARGB_8888, false);
                                      hwBmp.recycle();
                                      hb.close();

                                      Bitmap scaledBmp = Bitmap.createScaledBitmap(softBmp, smallW, smallH, false);
                                      softBmp.recycle();
                                      runHybridAiOnBitmap(scaledBmp, origW, origH);
                                  } else {
                                      hb.close();
                                      isProcessing = false;
                                  }
                              } catch (Exception e) {
                                  isProcessing = false;
                              }
                          }

                          @Override
                          public void onFailure(int errorCode) {
                              mainHandler.post(() -> overlayView.setVisibility(View.VISIBLE));
                              isProcessing = false;
                          }
                      });
                  } catch (Exception e) {
                      overlayView.setVisibility(View.VISIBLE);
                      isProcessing = false;
                  }
              }

              private void runHybridAiOnBitmap(Bitmap bmp, int screenW, int screenH) {
                  InputImage image = InputImage.fromBitmap(bmp, 0);
                  List<Rect> detectedBoxes = new ArrayList<>();

                  // Step A: Run Full-Body Silhouette Segmenter (Catches Women/Bodies even from behind or sunglasses!)
                  bodySegmenter.process(image)
                          .addOnSuccessListener(mask -> {
                              Rect bodyRect = extractBodyBoxFromMask(mask, screenW, screenH);
                              if (bodyRect != null) {
                                  detectedBoxes.add(bodyRect);
                              }

                              // Step B: Also Run Face Detector for multiple people / small thumbnails
                              faceDetector.process(image)
                                      .addOnSuccessListener(faces -> {
                                          for (Face face : faces) {
                                              Rect fb = face.getBoundingBox();
                                              int fw = fb.width();
                                              int fh = fb.height();
                                              // Expand face box to cover hair, face, chest, and full body
                                              int left = Math.max(0, (fb.left - (int)(fw * 1.4f)) * 2);
                                              int top = Math.max(0, (fb.top - (int)(fh * 0.7f)) * 2);
                                              int right = Math.min(screenW, (fb.right + (int)(fw * 1.4f)) * 2);
                                              int bottom = Math.min(screenH, (fb.bottom + (int)(fh * 4.5f)) * 2);
                                              detectedBoxes.add(new Rect(left, top, right, bottom));
                                          }
                                          publishResults(detectedBoxes);
                                          bmp.recycle();
                                      })
                                      .addOnFailureListener(e -> {
                                          publishResults(detectedBoxes);
                                          bmp.recycle();
                                      });
                          })
                          .addOnFailureListener(e -> {
                              bmp.recycle();
                              isProcessing = false;
                          });
              }

              private Rect extractBodyBoxFromMask(SegmentationMask mask, int screenW, int screenH) {
                  ByteBuffer buffer = mask.getBuffer();
                  buffer.rewind();
                  int maskW = mask.getWidth();
                  int maskH = mask.getHeight();

                  int minX = maskW, maxX = 0, minY = maskH, maxY = 0;
                  int humanPixels = 0;
                  int totalSampled = 0;

                  for (int y = 0; y < maskH; y += 2) {
                      for (int x = 0; x < maskW; x += 2) {
                          float confidence = buffer.getFloat((y * maskW + x) * 4);
                          totalSampled++;
                          if (confidence > 0.55f) {
                              humanPixels++;
                              if (x < minX) minX = x;
                              if (x > maxX) maxX = x;
                              if (y < minY) minY = y;
                              if (y > maxY) maxY = y;
                          }
                      }
                  }

                  // If at least 2.5% of the screen has a human body silhouette -> Cover the entire body!
                  if (totalSampled > 0 && (humanPixels * 100.0f / totalSampled) >= 2.5f && maxX > minX && maxY > minY) {
                      float scaleX = (float) screenW / maskW;
                      float scaleY = (float) screenH / maskH;
                      int padX = (int) (screenW * 0.04f);
                      int padY = (int) (screenH * 0.04f);

                      int left = Math.max(0, (int) (minX * scaleX) - padX);
                      int top = Math.max(0, (int) (minY * scaleY) - padY);
                      int right = Math.min(screenW, (int) (maxX * scaleX) + padX);
                      int bottom = Math.min(screenH, (int) (maxY * scaleY) + padY);
                      return new Rect(left, top, right, bottom);
                  }
                  return null;
              }

              private void publishResults(List<Rect> boxes) {
                  mainHandler.post(() -> {
                      if (!boxes.isEmpty()) {
                          lastEmptyTime = System.currentTimeMillis();
                          overlayView.updateBoxes(boxes);
                      } else {
                          // Keep box for 350ms to prevent any flickering during video playback
                          if (System.currentTimeMillis() - lastEmptyTime > 350) {
                              overlayView.updateBoxes(Collections.emptyList());
                          }
                      }
                      isProcessing = false;
                  });
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  if (event.getPackageName() != null) {
                      String pkg = event.getPackageName().toString();
                      if (!pkg.contains("systemui")) {
                          currentPkg = pkg;
                      }
                      if (isSafeApp()) {
                          overlayView.updateBoxes(Collections.emptyList());
                      }
                  }

                  // Secret Developer Pause Check
                  if (System.currentTimeMillis() < pauseLockUntil) return;

                  // Ironclad Anti-Uninstall & Settings Blocker
                  String pkg = currentPkg.toLowerCase();
                  if (pkg.contains("settings") || pkg.contains("packageinstaller") || pkg.contains("lool") || pkg.contains("security")) {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root != null) {
                          String text = collectText(root).toLowerCase();
                          root.recycle();
                          // If user tries to open Project Ghaad inside Settings, App Info, Accessibility, or Device Admin -> Instant Kick!
                          if (text.contains("project ghaad") || text.contains("ghaad shield")) {
                              if (text.contains("uninstall") || text.contains("force stop") || text.contains("storage")
                                      || text.contains("permissions") || text.contains("deactivate") || text.contains("turn off")
                                      || text.contains("installed") || text.contains("battery")) {
                                  performGlobalAction(GLOBAL_ACTION_BACK);
                                  performGlobalAction(GLOBAL_ACTION_HOME);
                              }
                          }
                      }
                  }
              }

              private String collectText(AccessibilityNodeInfo node) {
                  if (node == null) return "";
                  StringBuilder sb = new StringBuilder();
                  if (node.getText() != null) sb.append(node.getText()).append(" ");
                  if (node.getContentDescription() != null) sb.append(node.getContentDescription()).append(" ");
                  int count = node.getChildCount();
                  for (int i = 0; i < count; i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) {
                          sb.append(collectText(child));
                          child.recycle();
                      }
                  }
                  return sb.toString();
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              @Override
              public void onInterrupt() {}
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/MainActivity.java
          package com.ghaad.shield;

          import android.app.Activity;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private Button btnAdmin, btnGuard;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setBackgroundColor(Color.parseColor("#0b0f19"));
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(60, 60, 60, 60);

                  TextView title = new TextView(this);
                  title.setText("PROJECT GHAAD v7.0\nFull-Body & Face AI Shield");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(22);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 25);

                  // Secret Developer Unlock: Long press title for 3 seconds to unlock Settings for 60s
                  title.setOnLongClickListener(v -> {
                      GhaadGuardService.pauseLockUntil = System.currentTimeMillis() + 60000;
                      DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                      ComponentName comp = new ComponentName(this, GhaadAdminReceiver.class);
                      if (dpm != null && dpm.isAdminActive(comp)) {
                          dpm.removeActiveAdmin(comp);
                      }
                      Toast.makeText(this, "Unlocked for 60 seconds!", Toast.LENGTH_LONG).show();
                      updateStatus();
                      return true;
                  });
                  layout.addView(title);

                  TextView sub = new TextView(this);
                  sub.setText("No Screen-Recording Popup Required!\nWorks in Portrait & Fullscreen Video.");
                  sub.setTextColor(Color.parseColor("#94a3b8"));
                  sub.setTextSize(14);
                  sub.setGravity(Gravity.CENTER);
                  sub.setPadding(0, 0, 0, 50);
                  layout.addView(sub);

                  btnAdmin = new Button(this);
                  btnAdmin.setOnClickListener(v -> {
                      ComponentName comp = new ComponentName(this, GhaadAdminReceiver.class);
                      Intent intent = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                      intent.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, comp);
                      startActivity(intent);
                  });
                  layout.addView(btnAdmin);

                  TextView space = new TextView(this);
                  space.setHeight(35);
                  layout.addView(space);

                  btnGuard = new Button(this);
                  btnGuard.setOnClickListener(v -> {
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                  });
                  layout.addView(btnGuard);

                  setContentView(layout);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateStatus();
              }

              private void updateStatus() {
                  DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                  ComponentName comp = new ComponentName(this, GhaadAdminReceiver.class);
                  boolean s1 = dpm != null && dpm.isAdminActive(comp);
                  btnAdmin.setText((s1 ? "✅ " : "❌ ") + "Step 1: Lock Uninstall (Device Admin)");

                  boolean s2 = GhaadGuardService.instance != null;
                  btnGuard.setText((s2 ? "✅ " : "❌ ") + "Step 2: Start Full-Body AI Blocker");
              }
          }
          EOF

      - name: Build APK with Gradle
        working-directory: android_build
        run: gradle assembleDebug

      - name: Prepare APK File
        run: cp android_build/app/build/outputs/apk/debug/app-debug.apk Ghaad_Mobile.apk

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghaad_Mobile_APK
          path: Ghaad_Mobile.apk
