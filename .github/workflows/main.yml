name: Build Ghaad V20 Non-Stop Silhouette APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python to Prepare NudeNet ONNX
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate V20 Non-Stop Silhouette Android Project
        run: |
          mkdir -p android_build/app/src/main/java/com/ghaad/shield
          mkdir -p android_build/app/src/main/res/xml
          mkdir -p android_build/app/src/main/assets

          pip install --quiet nudenet onnx onnxruntime numpy
          python3 - << 'PYEOF'
          import os, onnx, nudenet
          from onnx import version_converter

          pkg_dir = os.path.dirname(nudenet.__file__)
          onnx_files = [f for f in os.listdir(pkg_dir) if f.endswith('.onnx')]
          src_path = os.path.join(pkg_dir, onnx_files[0])

          model = onnx.load(src_path)
          model.ir_version = 8
          try:
              if model.opset_import[0].version > 17:
                  model = version_converter.convert_version(model, 17)
                  model.ir_version = 8
          except Exception:
              pass

          target_path = 'android_build/app/src/main/assets/nudenet.onnx'
          onnx.save(model, target_path)
          print("Saved verified ONNX model, size:", os.path.getsize(target_path))
          PYEOF

          cat << 'EOF' > android_build/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GhaadShieldV20"
          include ':app'
          EOF

          cat << 'EOF' > android_build/build.gradle
          plugins {
              id 'com.android.application' version '8.1.2' apply false
          }
          EOF

          cat << 'EOF' > android_build/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3072m
          EOF

          cat << 'EOF' > android_build/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ghaad.shield'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ghaad.shield"
                  minSdk 24
                  targetSdk 33
                  versionCode 28
                  versionName "20.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              aaptOptions {
                  noCompress "onnx", "tflite"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta5'
              implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>

              <application
                  android:label="Ghaad V20 Silhouette"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service android:name=".GhaadGuardService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_build/app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:accessibilityFlags="flagRetrieveInteractiveWindows"
              android:notificationTimeout="40"/>
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/SilhouetteOverlayView.java
          package com.ghaad.shield;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.view.View;
          import java.util.ArrayList;
          import java.util.List;

          public class SilhouetteOverlayView extends View {
              private Bitmap bodyMaskBitmap = null;
              private final List<Rect> silhouettes = new ArrayList<>();
              private final Paint bitmapPaint = new Paint(Paint.FILTER_BITMAP_FLAG);
              private final Paint silhouettePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint badgePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private String statusText = "";
              private final Rect destRect = new Rect();

              public SilhouetteOverlayView(Context context) {
                  super(context);
                  silhouettePaint.setColor(Color.BLACK);
                  silhouettePaint.setAlpha(255);
                  silhouettePaint.setStyle(Paint.Style.FILL);

                  badgePaint.setColor(Color.rgb(16, 185, 129));
                  badgePaint.setTextSize(22f);
                  badgePaint.setFakeBoldText(true);
              }

              public synchronized void updateSilhouette(Bitmap newMask, List<Rect> targets, String status) {
                  if (bodyMaskBitmap != null && bodyMaskBitmap != newMask) {
                      bodyMaskBitmap.recycle();
                  }
                  bodyMaskBitmap = newMask;
                  silhouettes.clear();
                  if (targets != null) {
                      silhouettes.addAll(targets);
                  }
                  statusText = status != null ? status : "";
                  postInvalidate();
              }

              public synchronized void clearAll() {
                  if (bodyMaskBitmap != null) {
                      bodyMaskBitmap.recycle();
                      bodyMaskBitmap = null;
                  }
                  silhouettes.clear();
                  statusText = "";
                  postInvalidate();
              }

              @Override
              protected synchronized void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  int w = getWidth();
                  int h = getHeight();

                  if (bodyMaskBitmap != null && !bodyMaskBitmap.isRecycled()) {
                      destRect.set(0, 0, w, h);
                      canvas.drawBitmap(bodyMaskBitmap, null, destRect, bitmapPaint);
                  }

                  for (Rect r : silhouettes) {
                      drawHumanSilhouetteShape(canvas, r);
                  }

                  if (!statusText.isEmpty()) {
                      canvas.drawText(statusText, 30, 105, badgePaint);
                  }
              }

              private void drawHumanSilhouetteShape(Canvas canvas, Rect r) {
                  float cx = r.centerX();
                  float top = r.top;
                  float bottom = r.bottom;
                  float width = r.width();
                  float height = r.height();

                  RectF headOval = new RectF(cx - width * 0.30f, top, cx + width * 0.30f, top + height * 0.40f);
                  RectF torsoDome = new RectF(r.left, top + height * 0.22f, r.right, bottom);
                  canvas.drawOval(headOval, silhouettePaint);
                  canvas.drawRoundRect(torsoDome, width * 0.40f, width * 0.40f, silhouettePaint);
              }
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/NudeNetClassifier.java
          package com.ghaad.shield;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Rect;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.nio.FloatBuffer;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          import ai.onnxruntime.OnnxTensor;
          import ai.onnxruntime.OrtEnvironment;
          import ai.onnxruntime.OrtSession;

          public class NudeNetClassifier {
              private OrtEnvironment env;
              private OrtSession session;
              private String inputName;
              private boolean isLoaded = false;

              public static class DetectionInfo {
                  public List<Rect> femaleAndBodyZones = new ArrayList<>();
                  public List<Rect> maleFaceZones = new ArrayList<>();
              }

              // ONLY Female & Exposed Body Classes (Never blocks bearded men, speakers, or normal clothes!)
              // 0: FEMALE_GENITALIA_COVERED, 1: FACE_FEMALE, 2: BUTTOCKS_EXPOSED,
              // 3: FEMALE_BREAST_EXPOSED, 4: FEMALE_GENITALIA_EXPOSED, 6: ANUS_EXPOSED,
              // 13: BELLY_EXPOSED, 16: FEMALE_BREAST_COVERED, 17: BUTTOCKS_COVERED
              private static final int[] TARGET_CLASSES = {
                  0, 1, 2, 3, 4, 6, 13, 16, 17
              };

              public NudeNetClassifier(Context context) {
                  try {
                      env = OrtEnvironment.getEnvironment();
                      File modelFile = new File(context.getFilesDir(), "nudenet_v20.onnx");
                      if (!modelFile.exists() || modelFile.length() < 1000000) {
                          InputStream is = context.getAssets().open("nudenet.onnx");
                          FileOutputStream fos = new FileOutputStream(modelFile);
                          byte[] buf = new byte[32768];
                          int len;
                          while ((len = is.read(buf)) != -1) {
                              fos.write(buf, 0, len);
                          }
                          fos.flush();
                          fos.close();
                          is.close();
                      }
                      OrtSession.SessionOptions opts = new OrtSession.SessionOptions();
                      opts.setIntraOpNumThreads(2);
                      session = env.createSession(modelFile.getAbsolutePath(), opts);
                      inputName = session.getInputNames().iterator().next();
                      isLoaded = true;
                  } catch (Exception ignored) {
                      isLoaded = false;
                  }
              }

              // Auto-crops black letterbox bars in Fullscreen horizontal videos (like 00:52-01:14!)
              // so small bikini figures in fullscreen get 3X higher resolution!
              private Rect findActiveVideoArea(Bitmap bmp) {
                  int w = bmp.getWidth();
                  int h = bmp.getHeight();
                  if (w > h) return new Rect(0, 0, w, h); // Already landscape

                  int topBar = 0;
                  int botBar = h;
                  for (int y = h / 10; y < h * 4 / 10; y += 6) {
                      int bright = 0;
                      for (int x = w / 5; x < w * 4 / 5; x += 12) {
                          int px = bmp.getPixel(x, y);
                          if (((px >> 16) & 0xFF) > 22 || ((px >> 8) & 0xFF) > 22 || (px & 0xFF) > 22) bright++;
                      }
                      if (bright >= 3) { topBar = Math.max(0, y - 10); break; }
                  }
                  for (int y = h * 9 / 10; y > h * 6 / 10; y -= 6) {
                      int bright = 0;
                      for (int x = w / 5; x < w * 4 / 5; x += 12) {
                          int px = bmp.getPixel(x, y);
                          if (((px >> 16) & 0xFF) > 22 || ((px >> 8) & 0xFF) > 22 || (px & 0xFF) > 22) bright++;
                      }
                      if (bright >= 3) { botBar = Math.min(h, y + 10); break; }
                  }
                  if (botBar - topBar < h / 4) return new Rect(0, 0, w, h);
                  return new Rect(0, topBar, w, botBar);
              }

              public DetectionInfo analyze(Bitmap fullBmp, int screenW, int screenH) {
                  DetectionInfo info = new DetectionInfo();
                  if (!isLoaded || session == null) return info;
                  try {
                      Rect activeRect = findActiveVideoArea(fullBmp);
                      Bitmap bmp = Bitmap.createBitmap(fullBmp, activeRect.left, activeRect.top, activeRect.width(), activeRect.height());

                      int roiW = bmp.getWidth();
                      int roiH = bmp.getHeight();
                      float scaleFullX = (float) screenW / fullBmp.getWidth();
                      float scaleFullY = (float) screenH / fullBmp.getHeight();
                      int offsetX = Math.round(activeRect.left * scaleFullX);
                      int offsetY = Math.round(activeRect.top * scaleFullY);
                      int activeScreenW = Math.round(roiW * scaleFullX);
                      int activeScreenH = Math.round(roiH * scaleFullY);

                      float r = Math.min(320.0f / roiW, 320.0f / roiH);
                      int unpadW = Math.round(roiW * r);
                      int unpadH = Math.round(roiH * r);

                      Bitmap resized = Bitmap.createScaledBitmap(bmp, unpadW, unpadH, true);
                      bmp.recycle();

                      Bitmap letterboxed = Bitmap.createBitmap(320, 320, Bitmap.Config.ARGB_8888);
                      Canvas c = new Canvas(letterboxed);
                      c.drawColor(Color.rgb(114, 114, 114));
                      c.drawBitmap(resized, 0, 0, null);
                      resized.recycle();

                      int[] pixels = new int[320 * 320];
                      letterboxed.getPixels(pixels, 0, 320, 0, 0, 320, 320);
                      letterboxed.recycle();

                      FloatBuffer fb = FloatBuffer.allocate(3 * 320 * 320);
                      int area = 320 * 320;
                      for (int i = 0; i < area; i++) {
                          int px = pixels[i];
                          fb.put(i, ((px >> 16) & 0xFF) / 255.0f);
                          fb.put(area + i, ((px >> 8) & 0xFF) / 255.0f);
                          fb.put(2 * area + i, (px & 0xFF) / 255.0f);
                      }
                      fb.rewind();

                      OnnxTensor tensor = OnnxTensor.createTensor(env, fb, new long[]{1, 3, 320, 320});
                      OrtSession.Result res = session.run(Collections.singletonMap(inputName, tensor));
                      Object rawOut = res.get(0).getValue();

                      float[][] preds;
                      if (rawOut instanceof float[][][]) {
                          float[][][] out3d = (float[][][]) rawOut;
                          if (out3d[0].length == 22) {
                              int anchors = out3d[0][0].length;
                              preds = new float[anchors][22];
                              for (int a = 0; a < anchors; a++) {
                                  for (int col = 0; col < 22; col++) {
                                      preds[a][col] = out3d[0][col][a];
                                  }
                              }
                          } else {
                              preds = out3d[0];
                          }
                      } else {
                          tensor.close();
                          res.close();
                          return info;
                      }
                      tensor.close();
                      res.close();

                      float scaleX = (float) activeScreenW / unpadW;
                      float scaleY = (float) activeScreenH / unpadH;

                      for (int i = 0; i < preds.length; i++) {
                          float[] row = preds[i];
                          float maleScore = row[4 + 12];
                          float femFaceScore = row[4 + 1];

                          // 1. Protect Male Faces & Torsos (e.g. Islamic speakers at 00:22-00:30!)
                          if (maleScore >= 0.22f && maleScore > femFaceScore) {
                              Rect mr = extractBox(row, scaleX, scaleY, offsetX, offsetY, screenW, screenH, 0.8f, 2.5f);
                              if (mr != null) info.maleFaceZones.add(mr);
                              continue;
                          }

                          // 2. Detect Female Faces & Exposed Body Parts
                          float bestTarget = 0f;
                          int bestCls = -1;
                          for (int cls : TARGET_CLASSES) {
                              if (cls == 1 && !GhaadGuardService.blockFemaleFaces) continue;
                              if (row[4 + cls] > bestTarget) {
                                  bestTarget = row[4 + cls];
                                  bestCls = cls;
                              }
                          }

                          if (bestTarget >= 0.16f && bestTarget > maleScore) {
                              float padX = (bestCls == 1) ? 0.70f : 0.45f;
                              float padY = (bestCls == 1) ? 2.00f : 0.70f;
                              Rect tr = extractBox(row, scaleX, scaleY, offsetX, offsetY, screenW, screenH, padX, padY);
                              if (tr != null) info.femaleAndBodyZones.add(tr);
                          }
                      }
                  } catch (Exception ignored) {}
                  return info;
              }

              private Rect extractBox(float[] row, float scaleX, float scaleY, int offX, int offY, int screenW, int screenH, float padX, float padY) {
                  float cx = row[0], cy = row[1], w = row[2], h = row[3];
                  if (cx <= 1.05f && cy <= 1.05f && w <= 1.05f && h <= 1.05f) {
                      cx *= 320f; cy *= 320f; w *= 320f; h *= 320f;
                  }
                  int bw = Math.round(w * scaleX);
                  int bh = Math.round(h * scaleY);
                  if (bw < 14 || bh < 14) return null;
                  int px = Math.round(bw * padX);
                  int py = Math.round(bh * padY);
                  int l = Math.max(0, offX + Math.round((cx - w / 2f) * scaleX) - px);
                  int t = Math.max(0, offY + Math.round((cy - h / 2f) * scaleY) - py);
                  int r = Math.min(screenW, offX + Math.round((cx + w / 2f) * scaleX) + px);
                  int b = Math.min(screenH, offY + Math.round((cy + h / 2f) * scaleY) + py);
                  // Cap single box height to 65% of screen so it never blacks out the entire phone!
                  if (b - t > (int) (screenH * 0.65f)) {
                      b = t + (int) (screenH * 0.65f);
                  }
                  return new Rect(l, t, r, b);
              }
          }
          EOF

          cat << 'EOF' > android_build/app/src/main/java/com/ghaad/shield/GhaadGuardService.java
          package com.ghaad.shield;

          import android.accessibilityservice.AccessibilityService;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.ColorSpace;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.hardware.HardwareBuffer;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.segmentation.Segmentation;
          import com.google.mlkit.vision.segmentation.SegmentationMask;
          import com.google.mlkit.vision.segmentation.Segmenter;
          import com.google.mlkit.vision.segmentation.selfie.SelfieSegmenterOptions;

          import java.nio.ByteBuffer;
          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class GhaadGuardService extends AccessibilityService {
              public static GhaadGuardService instance;
              public static volatile String activePkg = "";
              public static volatile boolean blockFemaleFaces = true;

              private WindowManager windowManager;
              private SilhouetteOverlayView overlayView;
              private Segmenter bodySegmenter;
              private NudeNetClassifier nudeNet;
              private Handler mainHandler;
              private ExecutorService executor;
              private volatile boolean isBusy = false;
              private long busyStartTime = 0;

              // ZERO-BLINK TRACKER: Keeps existing silhouettes steady without hiding overlay!
              private static class TrackedZone {
                  Rect rect;
                  int[] borderColors;
                  long timestamp;
              }
              private final List<TrackedZone> lockedZones = new ArrayList<>();
              private volatile boolean clearOnScroll = false;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  mainHandler = new Handler(Looper.getMainLooper());
                  executor = Executors.newSingleThreadExecutor();

                  try {
                      windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                      overlayView = new SilhouetteOverlayView(this);
                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT
                      );
                      params.gravity = Gravity.TOP | Gravity.START;
                      windowManager.addView(overlayView, params);
                  } catch (Exception ignored) {}

                  SelfieSegmenterOptions segOpts = new SelfieSegmenterOptions.Builder()
                          .setDetectorMode(SelfieSegmenterOptions.STREAM_MODE)
                          .enableRawSizeMask()
                          .build();
                  bodySegmenter = Segmentation.getClient(segOpts);

                  executor.execute(() -> {
                      nudeNet = new NudeNetClassifier(GhaadGuardService.this);
                  });

                  mainHandler.postDelayed(scanLoop, 450);
              }

              // Real-time check of foreground app so Home Wallpaper & App Drawer (01:34-01:36) are NEVER blocked!
              private boolean isCurrentScreenSafeLauncherOrSystem() {
                  try {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root != null) {
                          CharSequence rootPkg = root.getPackageName();
                          root.recycle();
                          if (rootPkg != null) {
                              activePkg = rootPkg.toString();
                          }
                      }
                  } catch (Exception ignored) {}

                  String p = activePkg.toLowerCase();
                  if (p.isEmpty()) return false;
                  return p.contains("launcher") || p.contains("sec.android.app.launcher")
                          || p.contains("quickstep") || p.contains("com.ghaad.shield")
                          || p.contains("inputmethod") || p.contains("honeyboard")
                          || p.contains("android.settings") || p.contains("dialer")
                          || p.contains("bkash") || p.contains("nagad");
              }

              private final Runnable scanLoop = new Runnable() {
                  @Override
                  public void run() {
                      if (isCurrentScreenSafeLauncherOrSystem()) {
                          lockedZones.clear();
                          overlayView.clearAll();
                          mainHandler.postDelayed(this, 400);
                          return;
                      }

                      // Watchdog: if isBusy got stuck during fullscreen rotation (00:52 bug!), auto-reset after 2.2s!
                      if (isBusy && (System.currentTimeMillis() - busyStartTime > 2200)) {
                          isBusy = false;
                      }

                      if (!isBusy && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          isBusy = true;
                          busyStartTime = System.currentTimeMillis();
                          captureWithoutBlinking();
                      }
                      mainHandler.postDelayed(this, 1020);
                  }
              };

              private void captureWithoutBlinking() {
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, executor, new TakeScreenshotCallback() {
                          @Override
                          public void onSuccess(ScreenshotResult result) {
                              try {
                                  HardwareBuffer hb = result.getHardwareBuffer();
                                  ColorSpace cs = result.getColorSpace();
                                  Bitmap hwBmp = Bitmap.wrapHardwareBuffer(hb, cs);
                                  if (hwBmp != null) {
                                      int origW = hwBmp.getWidth();
                                      int origH = hwBmp.getHeight();
                                      int smallW = Math.max(180, origW / 2);
                                      int smallH = Math.max(180, origH / 2);
                                      Bitmap softBmp = hwBmp.copy(Bitmap.Config.ARGB_8888, false);
                                      hwBmp.recycle();
                                      hb.close();

                                      Bitmap smallBmp = Bitmap.createScaledBitmap(softBmp, smallW, smallH, true);
                                      softBmp.recycle();
                                      processFrameSteady(smallBmp, origW, origH);
                                  } else {
                                      hb.close();
                                      isBusy = false;
                                  }
                              } catch (Exception e) {
                                  isBusy = false;
                              }
                          }

                          @Override
                          public void onFailure(int errorCode) {
                              isBusy = false;
                          }
                      });
                  } catch (Exception e) {
                      isBusy = false;
                  }
              }

              private void processFrameSteady(Bitmap smallBmp, int capW, int capH) {
                  // Always map to actual live overlay view dimensions (Fixes Fullscreen Rotation 00:52!)
                  final int screenW = overlayView.getWidth() > 0 ? overlayView.getWidth() : capW;
                  final int screenH = overlayView.getHeight() > 0 ? overlayView.getHeight() : capH;
                  final float scaleX = (float) screenW / smallBmp.getWidth();
                  final float scaleY = (float) screenH / smallBmp.getHeight();
                  final long now = System.currentTimeMillis();

                  // 1. Verify existing locked silhouettes without blinking!
                  synchronized (lockedZones) {
                      if (clearOnScroll) {
                          lockedZones.clear();
                          clearOnScroll = false;
                      } else {
                          Iterator<TrackedZone> it = lockedZones.iterator();
                          while (it.hasNext()) {
                              TrackedZone tz = it.next();
                              int[] curBorder = sampleOuterBorder(smallBmp, tz.rect, scaleX, scaleY);
                              if (isBorderChanged(tz.borderColors, curBorder) || (now - tz.timestamp > 4000)) {
                                  it.remove();
                              }
                          }
                      }
                  }

                  // 2. Run True NudeNet ONNX (Finds Female Faces & Exposed Bodies; Rejects Men!)
                  NudeNetClassifier.DetectionInfo nnInfo = (nudeNet != null)
                          ? nudeNet.analyze(smallBmp, screenW, screenH)
                          : new NudeNetClassifier.DetectionInfo();

                  List<Rect> newTargets = new ArrayList<>(nnInfo.femaleAndBodyZones);

                  // Also add exposed bikini / bare-back skin clusters (excluding male zones)
                  List<Rect> skinClusters = detectExposedSkinClusters(smallBmp, screenW, screenH, scaleX, scaleY);
                  for (Rect sc : skinClusters) {
                      if (!intersectsAny(sc, nnInfo.maleFaceZones)) {
                          newTargets.add(sc);
                      }
                  }

                  synchronized (lockedZones) {
                      for (Rect r : newTargets) {
                          if (!intersectsAny(r, nnInfo.maleFaceZones)) {
                              TrackedZone tz = new TrackedZone();
                              tz.rect = r;
                              tz.borderColors = sampleOuterBorder(smallBmp, r, scaleX, scaleY);
                              tz.timestamp = now;
                              lockedZones.add(tz);
                          }
                      }

                      List<Rect> combined = new ArrayList<>();
                      for (TrackedZone tz : lockedZones) {
                          combined.add(new Rect(tz.rect));
                      }
                      final List<Rect> mergedTargets = mergeOverlapping(combined, screenH);

                      lockedZones.clear();
                      for (Rect mr : mergedTargets) {
                          TrackedZone tz = new TrackedZone();
                          tz.rect = mr;
                          tz.borderColors = sampleOuterBorder(smallBmp, mr, scaleX, scaleY);
                          tz.timestamp = now;
                          lockedZones.add(tz);
                      }

                      // 3. Run Body Segmenter to shape the curtain to the exact human contour
                      InputImage inputImage = InputImage.fromBitmap(smallBmp, 0);
                      bodySegmenter.process(inputImage)
                              .addOnSuccessListener(mask -> {
                                  Bitmap silhouetteBmp = createExactBodyMaskBitmap(mask, mergedTargets, nnInfo.maleFaceZones, screenW, screenH);
                                  mainHandler.post(() -> {
                                      if (!isCurrentScreenSafeLauncherOrSystem()) {
                                          overlayView.updateSilhouette(silhouetteBmp, mergedTargets, "● V20 ACTIVE");
                                      } else {
                                          if (silhouetteBmp != null) silhouetteBmp.recycle();
                                          overlayView.clearAll();
                                      }
                                      isBusy = false;
                                  });
                                  smallBmp.recycle();
                              })
                              .addOnFailureListener(e -> {
                                  mainHandler.post(() -> {
                                      if (!isCurrentScreenSafeLauncherOrSystem()) {
                                          overlayView.updateSilhouette(null, mergedTargets, "● V20 ACTIVE");
                                      } else {
                                          overlayView.clearAll();
                                      }
                                      isBusy = false;
                                  });
                                  smallBmp.recycle();
                              });
                  }
              }

              private Bitmap createExactBodyMaskBitmap(SegmentationMask mask, List<Rect> targetZones, List<Rect> safeMaleZones, int screenW, int screenH) {
                  if (targetZones.isEmpty()) return null;

                  ByteBuffer buffer = mask.getBuffer();
                  buffer.rewind();
                  int maskW = mask.getWidth();
                  int maskH = mask.getHeight();
                  int[] pixels = new int[maskW * maskH];
                  boolean hasAnyPixel = false;

                  float scaleX = (float) screenW / maskW;
                  float scaleY = (float) screenH / maskH;

                  for (int y = 0; y < maskH; y++) {
                      int screenY = (int) (y * scaleY);
                      for (int x = 0; x < maskW; x++) {
                          float confidence = buffer.getFloat();
                          if (confidence >= 0.40f) {
                              int screenX = (int) (x * scaleX);
                              if (isPointInZones(screenX, screenY, targetZones) && !isPointInZones(screenX, screenY, safeMaleZones)) {
                                  pixels[y * maskW + x] = Color.BLACK;
                                  hasAnyPixel = true;
                              }
                          }
                      }
                  }

                  if (!hasAnyPixel) return null;
                  Bitmap bmp = Bitmap.createBitmap(maskW, maskH, Bitmap.Config.ARGB_8888);
                  bmp.setPixels(pixels, 0, maskW, 0, 0, maskW, maskH);
                  return bmp;
              }

              private List<Rect> detectExposedSkinClusters(Bitmap bmp, int screenW, int screenH, float scaleX, float scaleY) {
                  List<Rect> boxes = new ArrayList<>();
                  int w = bmp.getWidth(), h = bmp.getHeight();
                  int cols = 16, rows = 18;
                  int cellW = w / cols, cellH = h / rows;
                  if (cellW < 4 || cellH < 4) return boxes;

                  boolean[][] grid = new boolean[rows][cols];
                  for (int r = 1; r < rows - 1; r++) {
                      for (int c = 1; c < cols - 1; c++) {
                          int skin = 0, total = 0;
                          for (int dy = 2; dy < cellH; dy += 3) {
                              for (int dx = 2; dx < cellW; dx += 3) {
                                  total++;
                                  if (isSkin(bmp.getPixel(c * cellW + dx, r * cellH + dy))) skin++;
                              }
                          }
                          if (total > 0 && (skin * 100 / total) >= 48) grid[r][c] = true;
                      }
                  }

                  boolean[][] visited = new boolean[rows][cols];
                  for (int r = 1; r < rows - 1; r++) {
                      for (int c = 1; c < cols - 1; c++) {
                          if (grid[r][c] && !visited[r][c]) {
                              int minR = r, maxR = r, minC = c, maxC = c, count = 0;
                              List<int[]> q = new ArrayList<>();
                              q.add(new int[]{r, c});
                              visited[r][c] = true;
                              int idx = 0;
                              while (idx < q.size()) {
                                  int[] cur = q.get(idx++);
                                  count++;
                                  minR = Math.min(minR, cur[0]); maxR = Math.max(maxR, cur[0]);
                                  minC = Math.min(minC, cur[1]); maxC = Math.max(maxC, cur[1]);
                                  for (int dr = -1; dr <= 1; dr++) {
                                      for (int dc = -1; dc <= 1; dc++) {
                                          int nr = cur[0] + dr, nc = cur[1] + dc;
                                          if (nr >= 1 && nr < rows - 1 && nc >= 1 && nc < cols - 1 && grid[nr][nc] && !visited[nr][nc]) {
                                              visited[nr][nc] = true;
                                              q.add(new int[]{nr, nc});
                                          }
                                      }
                                  }
                              }
                              if (count >= 3) {
                                  boxes.add(new Rect(
                                          Math.max(0, (int) ((minC * cellW) * scaleX)),
                                          Math.max(0, (int) ((minR * cellH) * scaleY)),
                                          Math.min(screenW, (int) (((maxC + 1) * cellW) * scaleX)),
                                          Math.min(screenH, (int) (((maxR + 1) * cellH) * scaleY))
                                  ));
                              }
                          }
                      }
                  }
                  return boxes;
              }

              private int[] sampleOuterBorder(Bitmap bmp, Rect screenRect, float scaleX, float scaleY) {
                  int w = bmp.getWidth(), h = bmp.getHeight();
                  int l = Math.max(2, (int) (screenRect.left / scaleX) - 6);
                  int t = Math.max(2, (int) (screenRect.top / scaleY) - 6);
                  int r = Math.min(w - 3, (int) (screenRect.right / scaleX) + 6);
                  int b = Math.min(h - 3, (int) (screenRect.bottom / scaleY) + 6);

                  int[] samples = new int[12];
                  int idx = 0;
                  for (int i = 1; i <= 3; i++) {
                      samples[idx++] = bmp.getPixel(l + (r - l) * i / 4, t);
                      samples[idx++] = bmp.getPixel(l + (r - l) * i / 4, b);
                      samples[idx++] = bmp.getPixel(l, t + (b - t) * i / 4);
                      samples[idx++] = bmp.getPixel(r, t + (b - t) * i / 4);
                  }
                  return samples;
              }

              private boolean isBorderChanged(int[] oldB, int[] newB) {
                  if (oldB == null || newB == null || oldB.length != newB.length) return true;
                  int changed = 0;
                  for (int i = 0; i < oldB.length; i++) {
                      int c1 = oldB[i], c2 = newB[i];
                      int diff = Math.abs(((c1 >> 16) & 0xFF) - ((c2 >> 16) & 0xFF))
                               + Math.abs(((c1 >> 8) & 0xFF) - ((c2 >> 8) & 0xFF))
                               + Math.abs((c1 & 0xFF) - (c2 & 0xFF));
                      if (diff > 65) changed++;
                  }
                  return changed >= 6;
              }

              private List<Rect> mergeOverlapping(List<Rect> boxes, int screenH) {
                  if (boxes.size() <= 1) return boxes;
                  List<Rect> merged = new ArrayList<>(boxes);
                  boolean changed = true;
                  while (changed) {
                      changed = false;
                      for (int i = 0; i < merged.size(); i++) {
                          for (int j = i + 1; j < merged.size(); j++) {
                              Rect a = merged.get(i);
                              Rect b = merged.get(j);
                              if (Rect.intersects(a, b)) {
                                  Rect u = new Rect(a);
                                  u.union(b);
                                  if (u.height() < (int) (screenH * 0.65f)) {
                                      merged.set(i, u);
                                      merged.remove(j);
                                      changed = true;
                                      break;
                                  }
                              }
                          }
                          if (changed) break;
                      }
                  }
                  return merged;
              }

              private boolean isPointInZones(int x, int y, List<Rect> zones) {
                  for (Rect r : zones) {
                      if (r.contains(x, y)) return true;
                  }
                  return false;
              }

              private boolean intersectsAny(Rect target, List<Rect> zones) {
                  for (Rect r : zones) {
                      if (Rect.intersects(target, r)) return true;
                  }
                  return false;
              }

              private boolean isSkin(int px) {
                  int R = (px >> 16) & 0xFF, G = (px >> 8) & 0xFF, B = px & 0xFF;
                  if (R > 75 && G > 32 && B > 18 && R > G && G > B && (R - G) > 13 && (R - B) < 120) {
                      int Cr = 128 + ((112 * R - 93 * G - 18 * B) >> 8);
                      int Cb = 128 + ((-37 * R - 74 * G + 112 * B) >> 8);
                      return Cr >= 134 && Cr <= 173 && Cb >= 80 && Cb <= 125;
                  }
                  return false;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  if (event.getEventType() == AccessibilityEvent.TYPE_VIEW_SCROLLED) {
                      clearOnScroll = true;
                  }
                  if (event.getPackageName() != null) {
                      String pkg = event.getPackageName().toString();
                      if (!pkg.contains("systemui")) {
                          activePkg = pkg;
                      }
                      if (isCurrentScreenSafeLauncherOrSystem()) {
                          lockedZones.clear();
                          overlayView.clearAll();
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              @Override
              public void onInterrupt() {}
          }
