              private String collectBrowserText(AccessibilityNodeInfo node, int depth) {
                  if (node == null || depth > 8) return "";
                  StringBuilder sb = new StringBuilder();
                  if (node.getText() != null) sb.append(node.getText()).append(" ");
                  if (node.getContentDescription() != null) sb.append(node.getContentDescription()).append(" ");
                  int count = Math.min(node.getChildCount(), 12);
                  for (int i = 0; i < count; i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) {
                          sb.append(collectBrowserText(child, depth + 1));
                          child.recycle();
                      }
                  }
                  return sb.toString();
              }

              private final Runnable scanLoop = new Runnable() {
                  @Override
                  public void run() {
                      if (isHomeOrSafeApp()) {
                          synchronized (activeLockedBoxes) { activeLockedBoxes.clear(); }
                          overlayView.setBoxes(Collections.emptyList(), false);
